<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minijuegos de futbol</title>
<style>
:root{--bg:#0e1a14;--card:#16281f;--line:#2b4a3a;--txt:#eaf3ec;--mut:#93b09f;--acc:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px}
h1{margin:0 0 6px}
p{color:var(--mut);margin:0 0 20px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--txt);text-decoration:none}
a.card:hover{border-color:var(--acc)}
a.card b{display:block;font-size:18px;margin-bottom:4px}
a.card span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Minijuegos de futbol</h1>
<p>Retos de futbol en castellano.</p>
<a class="card" href="top10/"><b>Top 10 Futbol</b><span>162 niveles: nombra el top 10 con 5 vidas y sin tiempo.</span></a>
<a class="card" href="app/" style="margin-top:12px"><b>Minijuegos diarios</b><span>Más o menos, Once oculto, reto del día y ligas privadas con tus amigos.</span></a>
</main>
</body>
</html>
