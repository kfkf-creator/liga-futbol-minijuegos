<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">

<link rel="icon" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minijuegos de fútbol</title>
<style>
:root{--bg:#0b1020;--bg2:#131a33;--card:#1a2342;--line:#2a3560;--txt:#f2f4ff;--mut:#9aa6d4;--mm:#ff6b4a;--once:#2ee6c5;--top:#3ddc84;--gold:#ffc83d;--bad:#ff5470;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:26px;margin:0}
h2{font-size:18px;margin:22px 0 10px}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.gcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;border-left:6px solid var(--c,var(--line))}
.gcard .ic{font-size:30px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.gcard b{display:block;font-size:17px}
.gcard small{color:var(--mut)}
.gcard .pill{margin-left:auto;font-weight:800;color:var(--c);white-space:nowrap}
.gcard[disabled]{opacity:.5;cursor:default}
.btn{background:var(--gold);color:#1b1500;border:0;border-radius:14px;padding:12px 18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.block{display:block;width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mut);font-size:12px}
.tabs button span{display:block;font-size:22px}
.tabs button.on{color:var(--gold);font-weight:700}
.view{display:none}.view.on{display:block}
#game{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none}
#game.on{display:block}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.ghead .x{background:none;border:0;font-size:24px;color:var(--mut);padding:0 6px}
.ghead .t{font-weight:800;flex:1}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--c,var(--gold));width:0;transition:width .3s}
/* mas o menos */
.q{font-size:20px;font-weight:800;text-align:center;margin:14px 0}
.duel{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:22px 14px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.opt{min-width:0}.opt b{font-size:22px;overflow-wrap:anywhere;hyphens:auto;line-height:1.2}.opt.long b{font-size:17px}
.opt .v{font-weight:900;min-height:38px;line-height:1.1;overflow-wrap:anywhere}.opt .v .vn{font-size:30px}.opt .v .vu{font-size:14px;font-weight:700;color:var(--mut);display:block;margin-top:2px}
.opt.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.lose{border-color:var(--line);opacity:.65}
.opt.pickbad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card));opacity:1}
.vs{text-align:center;color:var(--mut);font-weight:800}
/* once oculto */
.pitch{background:linear-gradient(#0f5a36,#0c4a2d);border:2px solid #1f8a57;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;gap:14px;margin:12px 0}
.prow{display:flex;justify-content:space-around;gap:6px}
.slot{width:0;flex:1;max-width:96px;min-height:58px;border-radius:12px;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.slot small{opacity:.7;font-size:10px}
.slot.got{background:var(--once);color:#04231c;border:1px solid var(--once);font-weight:800}
.slot.miss{background:rgba(255,84,112,.3);border:1px solid var(--bad)}
.gk{align-self:center}
.inp{display:flex;gap:8px;position:relative}
.inp input{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);font:inherit;min-width:0}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;z-index:4;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.sug button small{color:var(--mut);margin-left:6px}
.lives{font-size:20px;letter-spacing:2px}
.fb{min-height:22px;margin:8px 0;font-weight:700}
.big{font-size:54px;font-weight:900;text-align:center;margin:6px 0;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--txt);color:#111;border-radius:999px;padding:10px 16px;font-weight:700;z-index:30}
input.alias{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:inherit;margin:6px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:10px;color:var(--mut)}
.seg button.on{background:var(--line);color:var(--txt);font-weight:700}
.install{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 0;padding:10px 14px;border:1px solid var(--gold);border-radius:14px;background:var(--card)}
.install .msg{flex:1 1 200px;font-size:14px}
.install .x{background:none;border:0;color:var(--mut);font-size:18px}
.upd{position:fixed;left:12px;right:12px;bottom:84px;z-index:40;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;border:1px solid var(--gold);border-radius:14px;background:var(--bg2);box-shadow:0 6px 24px #0008}
.opt.sm{min-height:0;padding:16px 12px}
.tl{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.tli{display:flex;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tli b{color:var(--gold);min-width:44px;font-variant-numeric:tabular-nums}
.cgrp{border-radius:12px;padding:10px 12px;margin:8px 0;color:#141414;display:flex;flex-direction:column;gap:2px}
.cgrp span{font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:700;font-size:13px;min-height:64px;overflow-wrap:anywhere;color:var(--txt)}
.tile.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--card))}
.btn[disabled]{opacity:.45;cursor:default}
.mhead,.mcs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.mhead{font-size:11px;color:var(--mut);text-align:center;margin:10px 0 4px}
.mrow{margin:6px 0}.mn{font-weight:800;font-size:14px;margin-bottom:2px}
.mc{border-radius:8px;padding:6px 3px;text-align:center;font-size:10.5px;line-height:1.15;font-weight:700;min-height:48px;min-width:0;display:flex;align-items:center;justify-content:center;overflow-wrap:break-word;word-break:normal;hyphens:auto;background:#2a3560}
.mc.ok{background:#1f9d5b;color:#fff}.mc.near{background:#d98a1f;color:#fff}
.code{font:800 26px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center}
</style>
</head>
<body>
<div id="app">
 <section class="view on wrap" id="v-hoy"></section>
 <section class="view wrap" id="v-juegos"></section>
 <section class="view wrap" id="v-ligas"></section>
 <section class="view wrap" id="v-perfil"></section>
</div>
<div id="game"></div>
<div class="upd" id="upd" hidden role="status"><span>Hay una versión nueva.</span><button class="btn" id="updBtn" type="button">Recargar</button></div>
<nav class="tabs" id="tabs">
 <button data-v="hoy" class="on"><span>📅</span>Hoy</button>
 <button data-v="juegos"><span>🎮</span>Juegos</button>
 <button data-v="ligas"><span>🏆</span>Ligas</button>
 <button data-v="perfil"><span>👤</span>Perfil</button>
</nav>
<script>
const DATA={"FUN":{"tray-iniesta":"Fue elegido Mejor Jugador de la Eurocopa 2012, el torneo en el que España revalidó el título con un 4-0 a Italia en la final.","tray-ronaldinho":"El 19 de noviembre de 2005 marcó dos goles en el Bernabéu (0-3) y el público madridista le aplaudió, un honor que antes solo había recibido Maradona con la camiseta del Barça.","tray-beckham":"Jugó 115 partidos con Inglaterra y fue el capitán en 58 de ellos a lo largo de seis años.","tray-henry":"Marcó 228 goles con el Arsenal y ganó cuatro veces la Bota de Oro de la Premier League (2002, 2004, 2005 y 2006), un récord de la competición.","tray-torres":"Fue Bota de Oro de la Eurocopa 2012 con tres goles, por jugar menos minutos que Mario Gómez, y marcó en las finales de 2008 y de 2012.","tray-xabi-alonso":"En el Liverpool marcó desde su propio campo al Luton en la FA Cup de 2006 y al Newcastle en septiembre de ese mismo año.","tray-buffon":"En 2001 la Juventus pagó por él 100.000 millones de liras, unos 53 millones de euros, récord mundial de traspaso para un portero.","tray-cannavaro":"Cumplió su partido 100 con Italia en la final del Mundial 2006 y ese año ganó el Balón de Oro, el tercer defensa en lograrlo tras Beckenbauer y Sammer.","tray-laudrup":"Ganó cinco Ligas seguidas en España: cuatro con el Barcelona (1991 a 1994) y la quinta con el Real Madrid, al que fichó en 1994.","tray-suker":"Ganó la Bota de Oro del Mundial 1998 con seis goles y llevó a Croacia al tercer puesto en su primer Mundial como país independiente.","tray-batistuta":"En 1994/95 marcó en los 11 primeros partidos de Serie A y batió un récord de Pascutti de 32 años. Ganó el Scudetto 2000/01 con la Roma.","tray-van-der-sar":"En 2008/09 pasó 1.311 minutos sin encajar un gol de liga, y en 2011 ganó la Premier con 40 años, el jugador más veterano en lograrlo.","ca-01":"Con su tercer título, Brasil se quedó para siempre la Copa Jules Rimet. Fue además el primer Mundial con tarjetas amarilla y roja y con sustituciones.","ca-02":"Países Bajos marcó 15 goles en siete partidos. Fue el primer Mundial en que se entregó el trofeo actual, obra del escultor italiano Silvio Gazzaniga.","ca-03":"México fue la primera nación en organizar dos Mundiales. Colombia, sede original, renunció por motivos económicos en 1982.","ca-04":"Fue la primera final de un Mundial sin goles y la primera decidida en una tanda de penaltis, ante 94.194 espectadores en el Rose Bowl de Pasadena.","ca-05":"Oliver Kahn fue elegido mejor jugador del torneo y sigue siendo el único portero que ha ganado el Balón de Oro de un Mundial.","ca-06":"España perdió su primer partido ante Suiza y aun así ganó el título, con solo 8 goles, el menor número de una campeona del mundo.","ca-07":"Croacia jugó prórroga en las tres eliminatorias previas a la final (Dinamarca, Rusia e Inglaterra), y Modrić fue elegido mejor jugador del torneo.","ca-08":"Platini marcó nueve goles en cinco partidos, un récord que sigue vigente para una sola Eurocopa.","ca-09":"Fue la última Eurocopa con la Alemania Occidental y la Unión Soviética, y se disputó en territorio germano occidental.","ca-10":"Yugoslavia fue excluida por sanciones el 31 de mayo de 1992, diez días antes del inicio, y Dinamarca ocupó su plaza y ganó el torneo.","ca-11":"Antes del torneo se pagaba hasta 150 a 1 por el título de Grecia. En semifinales marcó el único gol de plata de la historia de la Eurocopa.","ca-12":"Turquía llegó a la semifinal ante Alemania con al menos seis bajas, cuatro de ellas por sanción, y aun así se adelantó con un gol de Uğur Boral.","ca-13":"Portugal ganó la Eurocopa sin ganar ningún partido de la fase de grupos, con tres empates. Cristiano se lesionó pronto en la final y Éder marcó en el 109.","ca-14":"Inglaterra fue la primera selección en perder dos finales de Eurocopa seguidas: ante Italia en 2021 y ante España en 2024.","ta-01":"El Atlético hizo el doblete con la Copa del Rey, con Radomir Antić en el banquillo. El Pichichi fue Pizzi, del Tenerife, con 31 goles.","ta-02":"El Barça de Guardiola, en su primer año como entrenador, ganó el primer triplete del fútbol español: Liga, Copa y Champions.","ta-03":"Messi marcó 46 goles en Liga y ganó el Pichichi. El Barça igualó los 100 puntos que había logrado el Real Madrid la temporada anterior.","ta-04":"El Barça fue campeón con cuatro jornadas de antelación tras ganar 4-2 al Espanyol, y fue el equipo menos goleado, con solo 20 goles encajados.","ta-05":"Cristiano Ronaldo igualó con 31 goles el récord de Shearer en una Premier de 38 jornadas. El Derby County acabó último con solo 11 puntos.","ta-06":"Con Conte, el Chelsea ganó 30 partidos y encadenó 13 victorias seguidas. Harry Kane fue el máximo goleador con 29 tantos.","ta-07":"Haaland marcó 36 goles y batió el récord de la Premier para una temporada. El City completó el triplete: Liga, FA Cup y Champions.","ta-08":"Higuaín marcó 36 goles y superó los 35 de Nordahl en 1949/50, récord de la Serie A a 20 equipos. La Juventus ganó su quinto scudetto seguido.","ta-09":"El Milan ganó el título en la última jornada con un 3-0 al Sassuolo, su 19º Scudetto y el primero desde 2011. Immobile fue máximo goleador con 27 goles.","ta-10":"El Inter fue campeón con cinco jornadas de antelación al ganar 2-1 al Milan en el derbi del 22 de abril de 2024, lo que le dio su segunda estrella.","ta-11":"Grafite (28 goles) y Džeko (26) sumaron 54 tantos. Fue el primer título del Wolfsburgo, que lo logró con un 5-1 al Werder Bremen en la última jornada.","ta-12":"Fue el primer equipo en acabar una Bundesliga invicto, con 28 victorias y 6 empates, y cortó once títulos seguidos del Bayern.","ta-13":"El Montpellier ganó su primera Liga en la última jornada, con un 2-1 al Auxerre. Giroud y Nenê fueron máximos goleadores con 21 goles cada uno.","ta-14":"El Mónaco marcó 107 goles en Liga. El máximo goleador fue Cavani, del PSG, con 35, y Mbappé fue elegido mejor jugador joven.","linea-mundiales":"En 1930 solo cuatro selecciones europeas (Bélgica, Francia, Rumanía y Yugoslavia) cruzaron el océano en barco. Participaron 13 equipos en total.","linea-espana":"A la final de 1964 asistió Franco, con más de 79.000 personas en el Bernabéu, cuatro años después de que España fuera descalificada por negarse a viajar a Moscú.","linea-copa-europa":"La primera final se jugó en el Parc des Princes el 13 de junio de 1956. El Reims se adelantó 2-0 en diez minutos y el Madrid remontó para ganar 4-3.","linea-balon-oro":"Rodri ganó con 1.170 puntos, 41 más que Vinícius, y el Real Madrid boicoteó la gala de París. Aitana Bonmatí ganó el premio femenino.","linea-fichajes":"El traspaso de Cristiano al Madrid fue récord mundial: 80 millones de libras, unos 94 millones de euros. Lo recibieron unos 80.000 aficionados en el Bernabéu.","linea-estadios":"Se inauguró el 14 de diciembre de 1947 con 75.145 plazas y no recibió el nombre de Santiago Bernabéu hasta enero de 1955, en honor al presidente del club.","linea-entrenadores":"En 26 años en el United, Ferguson ganó 38 títulos, entre ellos 13 Premier League. Un 1-0 al Nottingham Forest en la FA Cup de 1990 se cita como el partido que le salvó el puesto.","linea-liga":"La primera Liga, de febrero a junio de 1929, la jugaron diez equipos. Paco Bienzobas, de la Real Sociedad, fue el máximo goleador con 17 goles.","linea-premier":"Antes de la temporada las casas de apuestas daban al Leicester 5000 a 1. Fue campeón sin jugar, con el 2-2 del Chelsea ante el Tottenham del 2 de mayo de 2016.","linea-eurocopa":"Solo se inscribieron 17 selecciones a la primera edición, y Inglaterra y Alemania Occidental no participaron. La fase final se jugó en Francia con cuatro equipos.","linea-momentos-mundial":"El Mundial de 1950 es el único sin final: el campeón salió de una liguilla de cuatro equipos. India se retiró por el coste del viaje.","linea-reglas":"La FIFA se fundó el 21 de mayo de 1904 en París con siete asociaciones: Bélgica, Dinamarca, Francia, Países Bajos, España, Suecia y Suiza.","con-01":"Hungría perdió dos finales del Mundial: 4-2 ante Italia en 1938 y 3-2 ante Alemania Occidental en 1954, la del Milagro de Berna.","con-02":"Karl-Heinz Rummenigge ganó el Balón de Oro dos años seguidos, en 1980 y 1981.","con-03":"Ancelotti es el entrenador con más Champions: cinco, dos con el Milan (2003 y 2007) y tres con el Real Madrid (2014, 2022 y 2024).","con-04":"El Galatasaray es el único club turco que ha ganado una gran competición UEFA: la Copa de la UEFA de 2000, y ese año también la Supercopa ante el Real Madrid.","con-05":"El Stadio delle Alpi se inauguró el 31 de mayo de 1990 para el Mundial. Su demolición acabó en febrero de 2009 y en su solar se levantó el estadio de la Juventus.","con-06":"Butragueño, El Buitre, marcó cuatro goles a Dinamarca (5-1) en los octavos de final del Mundial 1986.","con-07":"El trofeo Pichichi lo concede el diario Marca desde la temporada 1952/53 y recuerda al delantero del Athletic Rafael Moreno, Pichichi.","con-08":"Raúl marcó 323 goles con el Real Madrid y superó así los 307 de Di Stéfano, que eran la marca histórica del club.","con-09":"Deschamps es uno de los tres hombres que han ganado el Mundial como jugador y como entrenador, junto a Zagallo y Beckenbauer.","con-10":"La primera mascota de un Mundial fue Willie, en Inglaterra 1966.","con-11":"La Recopa se disputó durante 39 temporadas, de 1960/61 a 1998/99. La ganó primero la Fiorentina y la última, la Lazio, antes de fusionarse con la Copa de la UEFA.","con-12":"El Arsenal nació en octubre de 1886 como Dial Square, fundado por obreros de una fábrica de armamento de Woolwich.","con-13":"Figo fichó por el Real Madrid en 2000 por 62 millones de euros, récord mundial en su día, y ese mismo año ganó el Balón de Oro.","con-14":"Vialli ganó la Recopa de 1998 con el Chelsea como jugador-entrenador, con 33 años, el técnico más joven en ganar un título UEFA hasta que lo superó Villas-Boas en 2011.","con-15":"Eriksson fue el primer seleccionador extranjero de Inglaterra (2001 a 2006) y llegó a cuartos en los Mundiales de 2002 y 2006 y en la Eurocopa 2004.","con-16":"Kubala jugó con tres selecciones: Checoslovaquia (6 partidos), Hungría (3) y España (19).","con-17":"Robben marcó el gol del triunfo del Bayern en el minuto 89 de la final de 2013, la primera de la Champions entre dos equipos alemanes.","con-18":"Sol Campbell fichó por el Arsenal en 2001 sin coste, al acabar contrato con el Tottenham, y la afición del Spurs le llamó Judas.","con-19":"Donnarumma fue elegido mejor jugador de la Eurocopa 2020, el primer portero en conseguirlo.","con-20":"Kroos ganó seis Champions: una con el Bayern (2013) y cinco con el Real Madrid. Fue el primer alemán campeón de Europa con dos clubes.","con-21":"Geoff Hurst en 1966 y Mbappé en 2022 son los únicos jugadores que han marcado tres goles en una final de Mundial.","jugadores-de-campo-titulares-de-espana-en-la-final-de-la-eurocopa-2024-espana-2-":"Lamine Yamal cumplió 17 años el día antes de la final y es el jugador más joven en una final de Eurocopa o Mundial. España ganó su cuarta Eurocopa, récord.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-champions-2024-re":"Carvajal, Kroos, Modrić y Nacho igualaron los seis títulos de Gento, y Ancelotti sumó su quinta Champions como entrenador, récord.","jugadores-de-campo-titulares-del-barcelona-en-la-final-de-la-champions-2009-barc":"Fue la única final de Champions en la que se enfrentaron Messi y Cristiano Ronaldo. Xavi fue elegido mejor jugador del partido por la UEFA.","jugadores-de-campo-titulares-de-espana-en-la-final-del-mundial-2010-espana-1-0-p":"Se mostraron 14 tarjetas amarillas, récord en una final de Mundial, y Heitinga fue expulsado. Fue la primera selección europea campeona fuera de Europa.","jugadores-de-campo-titulares-del-psg-en-la-final-de-la-champions-2025-psg-5-0-in":"El 5-0 es la mayor diferencia en una final de las grandes competiciones europeas de clubes. Désiré Doué marcó dos goles con 19 años.","jugadores-de-campo-titulares-del-barcelona-en-la-final-de-la-champions-2015-barc":"El Barça fue el primer club europeo en lograr dos tripletes. Fue el último partido de Xavi con el Barcelona, el número 767.","jugadores-de-campo-titulares-de-italia-en-la-final-de-la-eurocopa-2020-italia-1-":"Luke Shaw marcó a los 1:57, el gol más rápido en una final de Eurocopa, y Bonucci, con 34 años, fue el goleador más veterano de una final.","jugadores-de-campo-titulares-de-alemania-en-la-final-del-mundial-2014-alemania-1":"Fue la primera victoria de una selección europea en un Mundial disputado en América. Götze, que había entrado como suplente, marcó en el minuto 113.","jugadores-de-campo-titulares-de-francia-en-la-final-del-mundial-2018-francia-4-2":"El gol en propia puerta de Mandžukić fue el primero en una final de Mundial. Con seis goles, fue la final más goleadora desde 1966.","jugadores-de-campo-titulares-de-argentina-en-la-final-del-mundial-2022-argentina":"Francia remontó un 0-2 con dos goles de Mbappé en 97 segundos, y Mbappé acabó con un triplete, algo que solo había logrado Hurst en una final.","jugadores-de-campo-titulares-del-liverpool-en-la-final-de-la-champions-2019-live":"Salah marcó de penalti a los 106 segundos, el segundo gol más rápido de una final de Champions. Fue la sexta Copa de Europa del Liverpool.","jugadores-de-campo-titulares-de-espana-en-la-final-de-la-eurocopa-2012-espana-4-":"El 4-0 es la mayor diferencia en una final de Eurocopa. España fue la primera selección en ganar tres grandes torneos seguidos: Euro 2008, Mundial 2010 y Euro 2012.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-champions-2014-re":"Ramos empató de cabeza en el minuto 93 y forzó la prórroga. Diego Costa, lesionado, tuvo que retirarse a los ocho minutos de partido.","jugadores-de-campo-titulares-del-barcelona-en-la-final-de-la-champions-2011-barc":"Abidal, operado de un tumor en el hígado dos meses antes, levantó la copa como capitán. Fue la primera final de Copa de Europa en el nuevo Wembley.","jugadores-de-campo-titulares-del-chelsea-en-la-final-de-la-champions-2021-chelse":"La final de Oporto se jugó con 14.110 espectadores, un 33% del aforo por la pandemia. Fue la tercera final de Champions entre dos equipos ingleses.","jugadores-de-campo-titulares-del-bayern-en-la-final-de-la-champions-2013-bayern-":"Fue la primera final de Champions entre dos equipos alemanes y cerró el triplete del Bayern con Jupp Heynckes en el banquillo.","jugadores-de-campo-titulares-del-inter-en-la-final-de-la-champions-2010-inter-2-":"El Inter salió sin ningún jugador italiano en el once inicial. Fue el primer triplete de un club italiano y Mourinho se marchó al Real Madrid días después.","jugadores-de-campo-titulares-del-milan-en-la-final-de-la-champions-2007-milan-2-":"Maldini, con 38 años, fue el jugador de campo más veterano en una final de Champions. Fue la revancha de Estambul 2005 y Inzaghi marcó los dos goles.","jugadores-de-campo-titulares-del-manchester-united-en-la-final-de-la-champions-1":"Keane y Scholes no jugaron por sanción y el Bayern ganaba 1-0. Sheringham empató en el 90+1 y Solskjær ganó en el 90+3.","jugadores-de-campo-titulares-de-inglaterra-en-la-final-del-mundial-1966-inglater":"El segundo gol de Hurst, un balón que botó en el larguero, lo validó el juez de línea Tofiq Bahramov. La final la vieron 32,3 millones de británicos por televisión.","jugadores-de-campo-titulares-de-brasil-en-la-final-del-mundial-1970-brasil-4-1-i":"Pelé se convirtió en el primer jugador con tres Mundiales ganados. Brasil se quedó para siempre la Copa Jules Rimet y 107.412 personas llenaron el Azteca.","jugadores-de-campo-titulares-de-italia-en-la-final-del-mundial-2006-italia-1-1-f":"Zidane marcó de penalti a lo Panenka en el minuto 7 y fue expulsado en el 110 por un cabezazo a Materazzi, en el último partido de su carrera.","jugadores-de-campo-titulares-de-espana-en-la-final-del-mundial-2026-espana-1-0-a":"Ferran Torres marcó el 1-0 en el minuto 106, tras un cabezazo de Nico Williams, ante 80.663 espectadores en el MetLife Stadium.","jugadores-de-campo-titulares-de-argentina-en-la-final-del-mundial-2026-espana-1-":"Emiliano Martínez hizo 11 paradas, récord de un portero en una final de Mundial. Messi fue el segundo jugador en disputar tres finales, tras Cafú.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-champions-2018-re":"Bale entró en el minuto 61 y marcó una chilena en el 63. Karius regaló además el primer gol a Benzema. Fue la tercera Champions seguida del Madrid.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-champions-2022-re":"Courtois hizo nueve paradas, récord en una final desde que Opta recoge datos (2003/04). El inicio se retrasó 36 minutos por problemas de seguridad en el Stade de France.","jugadores-de-campo-titulares-de-inglaterra-en-la-final-de-la-eurocopa-2024-ingla":"Cole Palmer empató en el minuto 73, pero Oyarzabal dio el título a España en el 86. Inglaterra fue la primera en perder dos finales de Eurocopa seguidas.","jugadores-de-campo-titulares-de-brasil-en-la-final-del-mundial-1958-brasil-5-2-s":"Pelé, con 17 años, es el goleador más joven de una final de Mundial, y Liedholm, con 35, el más veterano. Liedholm abrió el marcador a los cuatro minutos.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-copa-de-europa-19":"Puskás marcó cuatro goles y Di Stéfano tres, ante 127.621 espectadores en Hampden Park. Era la quinta Copa de Europa seguida del Madrid.","jugadores-de-campo-titulares-de-alemania-occidental-en-la-final-del-mundial-1974":"Neeskens marcó de penalti a los dos minutos sin que ningún alemán tocara el balón. Los dos penaltis de aquella final fueron los primeros en una final de Mundial.","jugadores-de-campo-titulares-de-paises-bajos-en-la-final-del-mundial-1974-aleman":"El inicio se retrasó porque el personal del estadio había retirado los banderines de córner y olvidó volver a colocarlos. Arbitró el inglés Jack Taylor.","jugadores-de-campo-titulares-de-argentina-en-la-final-del-mundial-1978-argentina":"Kempes marcó dos goles, entre ellos el 2-1 en el minuto 105, y Nanninga había empatado en el 82. Rensenbrink estrelló un balón en el poste en el tramo final.","jugadores-de-campo-titulares-del-celtic-en-la-final-de-la-copa-de-europa-1967-ce":"Todos los jugadores del Celtic habían nacido a menos de 30 millas de Glasgow. Fue el primer equipo británico campeón de Europa.","jugadores-de-campo-titulares-de-francia-en-la-final-del-mundial-1998-francia-3-0":"Zidane marcó dos goles de cabeza a balón parado y Desailly fue expulsado en el 68. Ronaldo fue excluido del once y repuesto antes del saque, tras una convulsión por la tarde.","jugadores-de-campo-titulares-de-brasil-en-la-final-del-mundial-1994-brasil-0-0-i":"Se jugó a mediodía y con unos 38 grados en el Rose Bowl, ante 94.194 espectadores. Pagliuca paró el penalti de Márcio Santos en la tanda.","jugadores-de-campo-titulares-de-argentina-en-la-final-del-mundial-1986-argentina":"Maradona dio el pase del gol decisivo a Burruchaga. Beckenbauer es el único en perder una final como jugador (1966) y como entrenador (1986).","jugadores-de-campo-titulares-del-barcelona-en-la-final-de-la-copa-de-europa-1992":"El gol de falta de Koeman en el minuto 112 dio al Barcelona su primera Copa de Europa. Cruyff era el entrenador y Vialli y Mancini jugaban en el Sampdoria.","jugadores-de-campo-titulares-de-italia-en-la-final-del-mundial-1982-italia-3-1-a":"Dino Zoff ganó con 40 años y es el campeón del mundo más veterano. Cabrini falló un penalti en la primera parte.","jugadores-de-campo-titulares-de-alemania-occidental-en-la-final-del-mundial-1990":"Pedro Monzón fue el primer jugador expulsado en una final de Mundial y Dezotti, el segundo, dejó a Argentina con nueve. Brehme marcó el penalti decisivo.","jugadores-de-campo-titulares-de-brasil-en-la-final-del-mundial-2002-brasil-2-0-a":"Ronaldo marcó en el 67 y en el 79, tras un error de Kahn, y Brasil logró su quinto título. Fue el primer partido de Mundial entre ambas selecciones.","jugadores-de-campo-titulares-de-francia-en-la-final-del-mundial-2006-italia-1-1-":"Trezeguet estrelló su penalti en el larguero y Grosso marcó el definitivo para Italia. Zidane recibió el Balón de Oro del torneo pese a su expulsión.","jugadores-de-campo-titulares-de-espana-en-la-final-de-la-eurocopa-2008-alemania-":"Torres batió a Lehmann con un globo tras un pase de Xavi y fue el mejor de la final. Fue el primer título de España desde 1964 y el último partido de Luis Aragonés.","jugadores-de-campo-titulares-del-real-madrid-en-la-final-de-la-champions-2002-re":"Zidane marcó una volea de zurda a la escuadra antes del descanso, considerada uno de los mejores goles de la historia de la Champions. Fue la novena Copa de Europa del Madrid.","jugadores-de-campo-titulares-del-manchester-united-en-la-final-de-la-champions-2":"Fue la primera final de Champions entre dos equipos ingleses. Terry resbaló al lanzar su penalti y Van der Sar paró el de Anelka en la muerte súbita.","jugadores-de-campo-titulares-del-liverpool-en-la-final-de-la-champions-2005-mila":"El Liverpool marcó tres goles en seis minutos (54, 56 y 60) tras ir 0-3 al descanso. Maldini había abierto el marcador a los 50 segundos.","jugadores-de-campo-titulares-del-barcelona-en-la-final-de-la-champions-2006-barc":"Lehmann fue el primer jugador expulsado en una final de Copa de Europa, en el minuto 18. Aun así, Sol Campbell adelantó al Arsenal antes del descanso."},"MM":[{"id":"mm-laliga-goles-historicos","cat":"Jugadores","q":"¿Quién ha marcado más goles en la Primera División española?","unit":"goles","asof":"LaLiga hasta 2025/26 (solo jugadores que ya no la disputan)","items":[{"n":"Lionel Messi","v":474,"src":"https://en.wikipedia.org/wiki/List_of_La_Liga_top_scorers"},{"n":"Cristiano Ronaldo","v":311,"src":"https://en.wikipedia.org/wiki/List_of_La_Liga_top_scorers"},{"n":"Karim Benzema","v":238,"src":"https://en.wikipedia.org/wiki/List_of_La_Liga_top_scorer function streak(){
  let d=dayNum(today()),cur=0;
  if(!S.days[dstrUTC(d)]) d--;                     /* si hoy aún no has jugado, la racha sigue viva hasta ayer */
  while(S.days[dstrUTC(d)]){cur++;d--;}
  return cur;
}
function dstrUTC(n){const d=new Date(n*86400000);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}

/* ================= capa de ligas (servidor intercambiable) ================= */
/* Interfaz: init(), setAlias(a), createLeague(name)->{code}, joinLeague(code)->{name}, myLeagues()->[{id,code,name}],
   board(leagueId,fromDay,toDay)->[{alias,mm,once,total}], submit(day,game,score). Dos implementaciones: Local y Supabase. */
const LocalBackend={
  kind:"local",
  db(){try{return JSON.parse(localStorage.getItem("minijuegos.local"))||{leagues:[]};}catch(e){return {leagues:[]};}},
  put(d){localStorage.setItem("minijuegos.local",JSON.stringify(d));},
  async setAlias(){},
  async createLeague(name){const d=this.db();const code=Math.random().toString(36).slice(2,8).toUpperCase();d.leagues.push({id:code,code,name,since:today()});this.put(d);return {code,id:code,name};},
  async joinLeague(code){const d=this.db();const l=d.leagues.find(x=>x.code===code.toUpperCase());if(!l)throw new Error("No existe esa liga");return l;},
  async myLeagues(){return this.db().leagues;},
  async board(id,from,to){const g={};let total=0;const L=this.db().leagues.find(x=>x.id===id);if(L&&L.since&&L.since>from)from=L.since;for(let n=dayNum(from);n<=dayNum(to);n++){const r=S.days[dstrUTC(n)];if(r)for(const k in r){g[k]=(g[k]||0)+r[k];total+=r[k];}}return [{alias:S.alias||"Tú",total,g}];},
  async submit(){}
};
const SB=DATA.CFG;
const SupabaseBackend={
  kind:"supabase",
  tok:null,
  load(){try{this.tok=JSON.parse(localStorage.getItem("minijuegos.sb"));}catch(e){}},
  async auth(){
    if(this.tok&&this.tok.access_token&&this.tok.exp>Date.now()/1000+60)return;
    let r;
    if(this.tok&&this.tok.refresh_token){
      r=await fetch(SB.supabaseUrl+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:this.tok.refresh_token})});
    }
    if(!r||!r.ok) r=await fetch(SB.supabaseUrl+"/auth/v1/signup",{method:"POST",headers:{apikey:SB.supabaseKey,"Content-Type":"application/json"},body:"{}"});
    if(!r.ok)throw new Error("No se pudo conectar con el servidor");
    const j=await r.json();
    this.tok={access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
    localStorage.setItem("minijuegos.sb",JSON.stringify(this.tok));
  },
  async call(path,opt){
    await this.auth();
    const r=await fetch(SB.supabaseUrl+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:SB.supabaseKey,Authorization:"Bearer "+this.tok.access_token,"Content-Type":"application/json"},opt&&opt.headers)}));
    if(!r.ok){let m="Error del servidor";try{const j=await r.json();m=j.message||m;}catch(e){}throw new Error(m);}
    const t=await r.text();return t?JSON.parse(t):null;
  },
  rpc(n,args){return this.call("rpc/"+n,{method:"POST",body:JSON.stringify(args||{})});},
  async setAlias(a){await this.rpc("set_alias",{p_alias:a});},
  async createLeague(name){const r=await this.rpc("create_league",{p_name:name});return {code:r.code,id:r.id,name};},
  async joinLeague(code){const r=await this.rpc("join_league",{p_code:code.toUpperCase()});return {id:r.id,code:r.code,name:r.name};},
  async myLeagues(){return await this.rpc("my_leagues");},
  async board(id,from,to){return await this.rpc("league_board",{p_league:id,p_from:from,p_to:to});},
  async submit(day,game,score){await this.rpc("submit_score",{p_day:day,p_game:game,p_score:score});}
};
const Backend=(SB.supabaseUrl&&SB.supabaseKey)?(SupabaseBackend.load(),SupabaseBackend):LocalBackend;
async function flushPending(){
  if(Backend.kind==="local"||!S.alias)return;
  const rest=[];
  for(const p of S.pending){try{await Backend.submit(p.day,p.game,p.score);}catch(e){rest.push(p);}}
  S.pending=rest;save();
}
const LAUNCH="2026-09-30";                      /* primer reto diario; el archivo empieza aquí */
function scoreOf(day,game){ const a=(S.days[day]||{})[game]; return a!=null?a:(S.arch[day]||{})[game]; }   /* lo jugado el propio día manda sobre el archivo */
/* Partida en curso: se guarda tras cada jugada, así cerrar y reabrir continúa donde estabas y no permite repetir */
function progGet(day,game){ return (S.prog||{})[day+"|"+game]||null; }
function progSet(day,game,o){ (S.prog=S.prog||{})[day+"|"+game]=o; save(); }
function recordScore(day,game,score){
  if(S.prog)delete S.prog[day+"|"+game];
  if(scoreOf(day,game)!=null){save();return;}
  if(day===today())return recordDaily(game,score);
  (S.arch[day]=S.arch[day]||{})[game]=score;save();     /* el archivo no cuenta para liga ni racha */
}
function recordDaily(game,score){
  const t=today();
  S.days[t]=S.days[t]||{};
  if(S.days[t][game]!=null)return;              /* el primer resultado del día es el que cuenta */
  S.days[t][game]=score;
  S.pending.push({day:t,game,score});
  save();flushPending();
}

/* ---------- Más o menos ---------- */
function mmRounds(seed,n){
  const r=rng(seed),sets=DATA.MM,out=[];let last=-1;
  for(let i=0;i<n;i++){
    const target=3.2-i*(2.2/(n-1));           /* de pares muy distintos a pares ajustados */
    let best=null;
    for(let k=0;k<50;k++){
      let si=Math.floor(r()*sets.length);if(si===last&&sets.length>1)si=(si+1)%sets.length;
      const s=sets[si];let a=Math.floor(r()*s.items.length),b=Math.floor(r()*s.items.length);
      if(a===b)continue;
      const A=s.items[a],B=s.items[b],ratio=Math.max(A.v,B.v)/Math.max(1,Math.min(A.v,B.v));
      const d=Math.abs(Math.log(ratio)-Math.log(target));
      if(!best||d<best.d)best={d,s,A,B};
    }
    last=sets.indexOf(best.s);out.push(best);
  }
  return out;
}
function fmt(n){return n.toLocaleString("es-ES");}
function playMM(day){
  const hoy=day===today();
  openGame("Más o menos"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--mm)");
  const N=10,rounds=mmRounds(hash("mm"+day),N);
  let sv=progGet(day,"mm");
  if(!sv){ sv={i:0,hits:0,t0:Date.now()}; progSet(day,"mm",sv); }
  if(sv.hits==null) sv.hits=(sv.score||0)/10;
  let i=sv.i,hits=sv.hits,locked=false,cur=null,done=false,label="";
  const t0=sv.t0||Date.now();
  const remaining=()=>hoy?T_MM-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{ $("#gsc").textContent=(hoy?"⏱ "+fmtT(remaining())+" · ":"")+label; };
  function next(){
    cur=rounds[i];locked=false;
    const flip=rng(hash("f"+day+i))()<.5;
    const [X,Y]=flip?[cur.B,cur.A]:[cur.A,cur.B];cur.X=X;cur.Y=Y;
    label="Duelo "+(i+1)+"/"+N;hud();
    $("#gb").innerHTML=`<div class="bar" style="--c:var(--mm)"><i style="width:${i/N*100}%"></i></div>
    <div class="mut" style="text-align:center">${esc(cur.s.cat)}</div><div class="q">${esc(cur.s.q)}</div>
    <div class="duel"><button class="opt${X.n.length>22?" long":""}" data-o="0"><b>${esc(X.n)}</b><div class="v"></div></button><div class="vs">o</div><button class="opt${Y.n.length>22?" long":""}" data-o="1"><b>${esc(Y.n)}</b><div class="v"></div></button></div>
    <div class="mut" style="text-align:center;margin-top:10px;font-size:13px">${esc(cur.s.asof||"")}</div><div id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  }
  function pick(o){
    if(locked||done)return;locked=true;
    const pickV=[cur.X,cur.Y][o],other=[cur.X,cur.Y][1-o],ok=pickV.v>other.v;
    const opts=document.querySelectorAll(".opt");
    [cur.X,cur.Y].forEach((it,k)=>{opts[k].querySelector(".v").innerHTML=`<span class="vn">${esc(fmt(it.v))}</span> <small class="vu">${esc(cur.s.unit)}</small>`;opts[k].classList.add(it.v>(k?cur.X:cur.Y).v?"win":"lose");});
    if(!ok)opts[o].classList.add("pickbad");
    if(ok)hits++;
    progSet(day,"mm",{i:i+1,hits,t0});                   /* si cierras aquí, continúas en el duelo siguiente */
    label=hits+" acierto"+(hits===1?"":"s");hud();
    $("#nx").innerHTML=`<button class="btn block" style="margin-top:14px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;if(i>=N)end(false);else next();};
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    const rem=timeout?0:Math.max(0,remaining());
    const bonus=hoy?timeBonus(hits,rem,T_MM):0,score=hits*(hoy?9:10)+bonus;
    recordScore(day,"mm",score);
    $("#gsc").textContent="";
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:30px">${timeout?"Se acabó el tiempo. ":""}Has acertado ${hits} de ${N}${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(i>=N)end(false);
  else if(remaining()<=0)end(true);
  else{ next(); if(hoy)TIMER=setInterval(()=>{ if(remaining()<=0)end(true); else hud(); },250); }
}

/* ---------- Once oculto ---------- */
const PLAYERS={state:"idle",list:[]};
async function loadPlayers(){
  if(PLAYERS.state!=="idle")return;PLAYERS.state="loading";
  try{const r=await fetch("../top10/entidades/jugadores.json");if(!r.ok)throw 0;PLAYERS.list=(await r.json()).map(x=>({n:x[0],nk:norm(x[0]),sub:[x[1],x[2]||""].filter(Boolean).join(" · "),f:x[3]||60}));PLAYERS.state="ready";}catch(e){PLAYERS.state="failed";}
}
loadPlayers();
function lineupOfDay(d){const order=shuffled(DATA.LINEUPS,rng(20260930));return order[dayNum(d)%order.length];}
function rowLabel(r,R){return r===0?"Defensa":r===R-1?"Delantero":"Medio";}
function keysOf(L,a){const s=new Set([norm(a.n)]);(a.a||[]).forEach(x=>s.add(norm(x)));if(L.auto){const t=norm(a.n).split(" "),l=t[t.length-1];if(l.length>=4)s.add(l);}return [...s].filter(Boolean);}
function judge(L,raw,found){
  const q=norm(raw);if(!q)return {t:"empty"};
  let near=-1;
  for(let i=0;i<L.ans.length;i++){
    const ks=L.ans[i].keys;
    if(ks.includes(q))return found.has(i)?{t:"dup",i}:{t:"hit",i};
  }
  for(let i=0;i<L.ans.length;i++){
    if(found.has(i))continue;
    for(const k of L.ans[i].keys){const tol=k.length>=10?2:k.length>=6?1:0;if(tol&&lev(q,k)<=tol&&q.length>=4)near=i;}
  }
  return near>=0?{t:"hit",i:near}:{t:"miss"};
}
let _extra=null;
function allNames(){                                   /* base de jugadores + respuestas de todas las alineaciones que falten (sin delatar las del día) */
  if(_extra&&_extra.n===PLAYERS.list.length)return _extra.l;
  const have=new Set(PLAYERS.list.map(e=>e.nk)),add=[];
  DATA.LINEUPS.forEach(L=>L.ans.forEach(a=>{const nk=norm(a.n);if(!have.has(nk)){have.add(nk);add.push({n:a.n,nk,sub:"",f:50});}}));
  _extra={n:PLAYERS.list.length,l:PLAYERS.list.concat(add)};return _extra.l;
}
function suggestP(raw,found,L){
  const q=norm(raw);if(q.length<2)return [];
  const got=new Set([...found].map(i=>norm(L.ans[i].n)));
  const out=[];
  for(const e of allNames()){
    if(got.has(e.nk))continue;
    let s=-1;if(e.nk.startsWith(q))s=0;else if(e.nk.indexOf(" "+q)>=0)s=1;else if(q.length>=3&&e.nk.includes(q))s=2;
    if(s>=0)out.push({e,s});
  }
  out.sort((x,y)=>x.s-y.s||y.e.f-x.e.f||x.e.nk.length-y.e.nk.length);
  return out.slice(0,6).map(x=>x.e);
}
function playOnce(day){
  const hoy=day===today();
  openGame("Once oculto"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--once)");
  let L=lineupOfDay(day);
  L=Object.assign({},L);L.ans=L.ans.map(a=>Object.assign({keys:keysOf(L,a)},a));
  let svo=progGet(day,"once");
  const t0=(svo&&svo.t0)||Date.now();
  const remaining=()=>hoy?T_ONCE-(Date.now()-t0)/1000:Infinity;
  let timedOut=false;
  const found=new Set(svo?svo.f:[]),MAXL=5;let lives=svo?svo.l:MAXL,over=!!svo&&(svo.l<=0||svo.f.length===10),slotOf=[],k=0;
  if(!over&&hoy&&remaining()<=0){over=true;timedOut=true;}
  /* cada respuesta ocupa su hueco según el orden de la formación (de defensa a ataque) */
  L.rows.forEach((n,r)=>{for(let j=0;j<n;j++)slotOf.push({r,j,idx:k++});});
  const R=L.rows.length;
  function draw(msg){
    progSet(day,"once",{f:[...found],l:lives,t0});
    const rowsHtml=[];
    for(let r=R-1;r>=0;r--){
      rowsHtml.push(`<div class="prow">${slotOf.filter(s=>s.r===r).map(s=>{const a=L.ans[s.idx],g=found.has(s.idx);return `<div class="slot ${g?"got":over?"miss":""}">${(g||over)?esc(a.n):`?<small>${rowLabel(r,R)}</small>`}</div>`;}).join("")}</div>`);
    }
    const hearts="❤️".repeat(lives)+"🖤".repeat(MAXL-lives);
    $("#gsc").innerHTML=`${hoy?`<span id="tmr">⏱ ${fmtT(remaining())}</span> `:""}<span class="lives">${hearts}</span>`;
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;font-size:14px">${esc(L.title.replace(/^Jugadores de campo titulares d(e|el) /,""))}</div>
    <div class="pitch">${rowsHtml.join("")}<div class="prow"><div class="slot gk got" style="width:auto;max-width:none;flex:0 0 auto;min-height:0;padding:8px 18px;font-size:14px;white-space:nowrap;background:#fff;color:#111">🧤 ${esc(L.gk||"Portero")}</div></div></div>
    <div class="mut" style="text-align:center;margin-bottom:6px">${found.size}/10 jugadores · escribe el apellido o el nombre</div>
    ${over?"":`<div class="inp"><input id="gi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Jugador de campo..."><button class="btn" id="gs">OK</button><div class="sug" id="sg" style="display:none"></div></div>`}
    ${over?"":`<button class="btn ghost block" id="giveup" style="margin-top:8px">Rendirme</button>`}
    <div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over){
      $("#giveup").onclick=()=>{if(confirm("¿Rendirte? Te quedas con "+found.size+" acierto"+(found.size===1?"":"s")+".")){lives=0;over=true;draw("Te has rendido");}};
      const inp=$("#gi");
      const submit=v=>{const val=(v??inp.value);if(!val.trim())return;try2(val);};
      $("#gs").onclick=()=>submit();
      inp.onkeydown=e=>{if(e.key==="Enter")submit();};
      inp.oninput=()=>{const s=suggestP(inp.value,found,L),box=$("#sg");if(!s.length){box.style.display="none";return;}box.style.display="block";box.innerHTML=s.map((e,n)=>`<button data-n="${n}">${esc(e.n)}<small>${esc(e.sub)}</small></button>`).join("");box.querySelectorAll("button").forEach((b,n)=>b.onclick=()=>submit(s[n].n));};
      inp.focus();
    }
    if(over)finish();
  }
  function try2(v){
    const j=judge(L,v,found);
    if(j.t==="hit"){found.add(j.i);if(found.size===10){over=true;return draw("¡Completo!");}return draw("✔ "+esc(L.ans[j.i].n));}
    if(j.t==="dup")return draw("Ya lo tenías");
    lives--;if(lives<=0){over=true;return draw("Sin vidas");}
    draw("✘ No juega de titular (o no lo reconozco). Pierdes una vida.");
  }
  function finish(){
    stopTimer();
    const rem=timedOut?0:Math.max(0,remaining()),bonus=hoy?timeBonus(found.size,rem,T_ONCE):0;
    const score=found.size*(hoy?9:10)+bonus;
    recordScore(day,"once",score);
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center">${timedOut?"Se acabó el tiempo. ":""}${found.size} de 10${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}
    <button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  draw(timedOut?"Se acabó el tiempo":"");
  if(hoy&&!over)TIMER=setInterval(()=>{
    if(over){stopTimer();return;}
    if(remaining()<=0){timedOut=true;over=true;draw("Se acabó el tiempo");return;}
    const t=document.getElementById("tmr");if(t)t.textContent="⏱ "+fmtT(remaining());
  },250);
}

function chunkOfDay(bank,n,day){                       /* n elementos consecutivos de un orden fijo, según el día */
  const order=shuffled(bank,rng(20260930)),len=order.length,start=(dayNum(day)*n)%len,out=[];
  for(let k=0;k<n;k++)out.push(order[(start+k)%len]);
  return out;
}

function bindNameInput(sugFn,onSubmit){

  const submit=v=>{const val=(v??inp.value);if(!val.trim())return;onSubmit(val);};
  $("#gs").onclick=()=>submit();

  inp.focus();
}
function suggestAny(raw,skip){                          /* sugerencias de la base de jugadores */
  const q=norm(raw);if(q.length<2)return [];
  const out=[];
  for(const e of allNames()){
    if(skip&&skip.has(e.nk))continue;
    let s=-1;if(e.nk.startsWith(q))s=0;else if(e.nk.indexOf(" "+q)>=0)s=1;else if(q.length>=3&&e.nk.includes(q))s=2;
    if(s>=0)out.push({e,s});
  }
  out.sort((x,y)=>x.s-y.s||y.e.f-x.e.f||x.e.nk.length-y.e.nk.length);
  return out.slice(0,6).map(x=>x.e);
}
function matchesName(raw,target){                       /* target: {n,a:[]} */
  const q=norm(raw);if(!q)return false;
  const ks=new Set([norm(target.n),...(target.a||[]).map(norm)]);
  const t=norm(target.n).split(" ");if(t[t.length-1].length>=4)ks.add(t[t.length-1]);
  for(const k of ks){if(k===q)return true;const tol=k.length>=10?2:k.length>=6?1:0;if(tol&&q.length>=4&&lev(q,k)<=tol)return true;}
  return false;
}

function playQuiz(id,day,cfg){

  const items=chunkOfDay(cfg.bank,N,day);

  if(!sv){sv={i:0,hits:0,t0:Date.now()};progSet(day,id,sv);}
  let i=sv.i,hits=sv.hits,locked=false,done=false,label="";
  const t0=sv.t0,rem=()=>hoy?cfg.T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=(hoy?"⏱ "+fmtT(rem())+" · ":"")+label;};
  function next(){
    const it=items[i];locked=false;label=(i+1)+"/"+N;hud();
    $("#gb").innerHTML=`<div class="bar" style="--c:${g.c}"><i style="width:${i/N*100}%"></i></div>${cfg.render(it)}
    <div class="duel" style="margin-top:14px">${cfg.options(it).map((o,k)=>`<button class="opt sm" data-o="${k}"><b>${esc(o)}</b></button>`).join("")}</div><div id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  }
  function pick(k){
    if(locked||done)return;locked=true;
    const it=items[i],right=cfg.correct(it),ok=k===right,opts=document.querySelectorAll(".opt");
    opts.forEach((b,n)=>b.classList.add(n===right?"win":"lose"));
    if(!ok)opts[k].classList.add("pickbad");
    if(ok)hits++;
    progSet(day,id,{i:i+1,hits,t0});
    label=hits+" acierto"+(hits===1?"":"s");hud();
    $("#nx").innerHTML=`<div class="card" style="margin-top:12px;font-size:14px">${esc(cfg.explain(it))}</div><button class="btn block" style="margin-top:10px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;if(i>=N)end(false);else next();};
  }
  function end(timeout){
    if(done)return;done=true;
    const bonus=hoy?timeBonus(hits,timeout?0:Math.max(0,rem()),cfg.T):0,score=hits*(hoy?9:10)+bonus;
    endScreen(day,id,score,`${timeout?"Se acabó el tiempo. ":""}Has acertado ${hits} de ${N}${hoy?" · bonus de velocidad +"+bonus:""}`);
  }
  if(i>=N)end(false);else if(rem()<=0)end(true);
  else{next();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Línea del tiempo ---------- */
function playLine(day){
  const hoy=day===today(),g=meta("line"),T=150;
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const puz=chunkOfDay(DATA.LINE,1,day)[0],its=puz.items,N=its.length;
  const sortedY=its.map(i=>i.y).sort((a,b)=>a-b);
  let sv=progGet(day,"line");
  if(!sv||!sv.o){sv={o:shuffled(its.map((_,k)=>k),rng(hash("line"+day))),t0:Date.now()};progSet(day,"line",sv);}
  let ord=sv.o.slice(),done=false;
  const t0=sv.t0,rem=()=>hoy?T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=hoy?"⏱ "+fmtT(rem()):"";};
  function save(){progSet(day,"line",{o:ord,t0});}
  function draw(){
    hud();
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">${esc(puz.title)}</div>
    <div class="q" style="font-size:17px">Ordena los hechos del más antiguo (arriba) al más reciente (abajo)</div>
    <div class="tl">${ord.map((k,i)=>`<div class="tli" style="align-items:center"><span style="flex:1">${esc(its[k].t)}</span>
      <button class="btn ghost" style="padding:8px 12px" data-m="${i}|-1" ${i===0?"disabled":""} aria-label="Subir">▲</button>
      <button class="btn ghost" style="padding:8px 12px" data-m="${i}|1" ${i===N-1?"disabled":""} aria-label="Bajar">▼</button></div>`).join("")}</div>
    <button class="btn block" id="sub" style="margin-top:12px">Entregar</button>`;
    document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.m.split("|").map(Number);[ord[i],ord[i+d]]=[ord[i+d],ord[i]];save();draw();});
    $("#sub").onclick=()=>end(false);
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    let pairs=0;for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)if(its[ord[a]].y<=its[ord[b]].y)pairs++;
    const tot=N*(N-1)/2,fr=pairs/tot,exact=ord.filter((k,i)=>its[k].y===sortedY[i]).length;
    let score;
    if(hoy){const r=timeout?0:Math.max(0,rem());score=Math.round(90*fr)+Math.round(10*fr*r/T);}
    else score=Math.round(100*fr);
    if(exact===N)score=hoy?score:100;
    const line=`${timeout?"Se acabó el tiempo. ":""}${exact} de ${N} en su sitio · ${pairs} de ${tot} parejas bien ordenadas`;
    const okRow=(k,i)=>its[k].y===sortedY[i];
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">Así lo entregaste (verde: en su sitio)</div>
    <div class="tl">${ord.map((k,i)=>`<div class="tli" style="border-color:${okRow(k,i)?"var(--ok)":"var(--bad)"}"><b>${its[k].y}</b><span>${esc(its[k].t)}</span></div>`).join("")}</div><div id="endbox"></div>`;
    recordScore(day,"line",score);$("#gsc").textContent="";
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center;margin-top:16px">${line}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(rem()<=0)end(true);
  else{draw();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Conexiones ---------- */
function playCon(day){
  const hoy=day===today(),g=meta("con"),T=300,COL=["#f5d90a","#9be564","#5bb8ff","#b58cff"];
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const puz=chunkOfDay(DATA.CON,1,day)[0];
  const tiles=[];puz.groups.forEach((gr,gi)=>gr.items.forEach(t=>tiles.push({t,gi})));
  const order=shuffled(tiles,rng(hash("con"+day)));
  let sv=progGet(day,"con");
  if(!sv){sv={f:[],m:0,t0:Date.now()};progSet(day,"con",sv);}
  let found=sv.f.slice(),mist=sv.m,sel=new Set(),done=false,msg="";
  const t0=sv.t0,rem=()=>hoy?T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=(hoy?"⏱ "+fmtT(rem())+" · ":"")+"fallos "+mist+"/4";};
  const byDiff=gi=>puz.groups[gi].diff||gi+1;
  function draw(reveal){
    hud();
    const rest=order.filter(x=>!found.includes(x.gi));
    const groupsHtml=(reveal?puz.groups.map((_,gi)=>gi).filter(gi=>!found.includes(gi)).concat(found):found).map(gi=>`<div class="cgrp" style="background:${COL[byDiff(gi)-1]}"><b>${esc(puz.groups[gi].name)}</b><span>${puz.groups[gi].items.map(esc).join(", ")}</span></div>`).join("");
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">Encuentra los 4 grupos de 4</div>${groupsHtml}
    ${reveal?"":`<div class="cgrid">${rest.map((x,n)=>`<button class="tile ${sel.has(x.t)?"on":""}" data-t="${esc(x.t)}">${esc(x.t)}</button>`).join("")}</div>
    <div class="fb" id="fb">${msg}</div>
    <div class="row"><button class="btn ghost" id="cdes">Deseleccionar</button><button class="btn" id="cok" ${sel.size===4?"":"disabled"}>Comprobar</button></div>`}`;
    if(!reveal){
      document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(sel.has(t))sel.delete(t);else if(sel.size<4)sel.add(t);draw();});
      $("#cdes").onclick=()=>{sel.clear();msg="";draw();};
      $("#cok").onclick=check;
    }
  }
  function save(){progSet(day,"con",{f:found,m:mist,t0});}
  function check(){
    if(done||sel.size!==4)return;
    const chosen=order.filter(x=>sel.has(x.t)),counts={};
    chosen.forEach(x=>counts[x.gi]=(counts[x.gi]||0)+1);
    const top=Math.max(...Object.values(counts)),gi=+Object.keys(counts).find(k=>counts[k]===top);
    if(top===4){found.push(gi);msg="";sel.clear();}
    else{mist++;msg=top===3?"Casi: tres son del mismo grupo.":"Esos cuatro no forman un grupo.";}
    save();
    if(found.length===4)end(false);
    else if(mist>=4)end(false);
    else draw();
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    const n=found.length;
    let score;
    if(hoy){const base=Math.max(0,Math.round(22.5*n)-5*mist);score=base+Math.round(10*(base/90)*(timeout?0:Math.max(0,rem()))/T);}
    else score=Math.max(0,Math.round(25*n-5*mist));
    draw(true);
    recordScore(day,"con",score);$("#gsc").textContent="";
    const line=`${timeout?"Se acabó el tiempo. ":mist>=4&&n<4?"Sin fallos disponibles. ":""}${n} de 4 grupos, ${mist} fallo${mist===1?"":"s"}`;
    $("#gb").insertAdjacentHTML("beforeend",`<div class="mut" style="text-align:center;margin-top:16px">${line}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`);
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(found.length===4||mist>=4)end(false);
  else if(rem()<=0)end(true);
  else{draw();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Trayectoria ---------- */
function playTray(day){
  const hoy=day===today(),g=meta("tray");
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const P=chunkOfDay(DATA.TRAY,1,day)[0];
  let sv=progGet(day,"tray");
  if(!sv){sv={shown:2,nat:0,pos:0,wrong:0,gs:[]};progSet(day,"tray",sv);}
  let {shown,nat,pos,wrong}=sv,gs=sv.gs.slice(),over=false;
  const cost=()=>10*(shown-2)+15*wrong;
  const hud=()=>{$("#gsc").textContent="Valor "+Math.max(10,100-cost())+" pts";};
  function save(){progSet(day,"tray",{shown,nat,pos,wrong,gs});}
  function draw(msg){
    hud();
    const rows=P.career.slice(0,shown);
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">¿Quién es? Sus clubes, en orden</div>
    <div class="tl">${rows.map(r=>`<div class="tli"><b style="min-width:82px">${esc(r.y)}</b><span>${esc(r.c)}</span></div>`).join("")}${shown<P.career.length?`<div class="tli mut"><b style="min-width:82px">?</b><span>${P.career.length-shown} club${P.career.length-shown===1?"":"es"} más</span></div>`:""}</div>
    <div class="row" style="margin:10px 0"><button class="btn ghost block" id="tmore" ${shown>=P.career.length?"disabled":""}>Otro club (−10)</button></div>
    ${gs.length?`<div class="mut" style="font-size:14px">Ya has probado: ${gs.map(esc).join(", ")}</div>`:""}
    ${over?"":INPUT_HTML}<div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(msg==="¡Correcto!"){const f=$("#fb");f.style.cssText="text-align:center;font-size:30px;font-weight:900;color:#fff;background:var(--ok);border-radius:16px;padding:14px;margin:10px 0";}
    if(!over){
      $("#tmore").onclick=()=>{if(shown<P.career.length){shown++;save();draw();}};
      bindNameInput(raw=>suggestAny(raw),guess);
    }
  }
  function guess(raw){
    if(matchesName(raw,P)){over=true;const score=Math.max(10,100-cost());draw("¡Correcto!");finish(score,`Era ${P.n}`);return;}
    wrong++;gs.push(raw.trim());save();
    if(wrong>=3){over=true;draw("");finish(0,`Era ${P.n}`);return;}
    draw("No es. Pierdes 15 puntos.");
  }
  function finish(score,line){
    stopTimer();recordScore(day,"tray",score);$("#gsc").textContent="";
    const rows=P.career;
    $("#endbox").innerHTML=`<div class="tl">${rows.map(r=>`<div class="tli"><b style="min-width:82px">${esc(r.y)}</b><span>${esc(r.c)}</span></div>`).join("")}</div>
    <div class="mut" style="text-align:center">${esc(line)}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(wrong>=3){over=true;draw("");finish(0,`Era ${P.n}`);}
  else draw("");
}

/* ---------- Jugador misterioso ---------- */
function playMist(day){
  const hoy=day===today(),g=meta("mist"),MAXT=6,SC=[100,85,70,55,40,25];
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const list=DATA.MIST.players,pool=list.filter(p=>p.fame>=3);
  const T=chunkOfDay(pool,1,day)[0];
  let sv=progGet(day,"mist");
  if(!sv){sv={gs:[]};progSet(day,"mist",sv);}
  const gs=sv.gs.slice();let over=false;
  const find=raw=>{const q=norm(raw);if(!q)return null;
    return list.find(p=>matchesName(raw,p))||null;};
  const cell=(ok,txt,extra)=>`<div class="mc ${ok}">${esc(txt)}${extra||""}</div>`;
  function row(p){
    const dy=T.born-p.born;
    return `<div class="mrow"><div class="mn">${esc(p.n)}</div><div class="mcs">
      ${cell(p.country===T.country?"ok":"no",p.country)}${cell(p.league===T.league?"ok":"no",p.league)}${cell(p.club===T.club?"ok":"no",p.club)}${cell(p.pos===T.pos?"ok":"no",p.pos)}
      ${cell(dy===0?"ok":Math.abs(dy)<=2?"near":"no",String(p.born)," "+(dy>0?"↑":dy<0?"↓":""))}</div></div>`;
  }
  const hud=()=>{$("#gsc").textContent="Intento "+Math.min(gs.length+1,MAXT)+"/"+MAXT;};
  function draw(msg){
    hud();
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">Adivina el jugador. Verde: coincide. Naranja: año cercano. Flecha: el secreto nació antes (↓) o después (↑).</div>
    <div class="mhead"><span>País</span><span>Liga</span><span>Club</span><span>Puesto</span><span>Nació</span></div>
    ${gs.map(n=>row(list.find(p=>p.n===n))).join("")}
    ${over?"":INPUT_HTML}<div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over)bindNameInput(raw=>{const q=norm(raw);if(q.length<2)return [];return list.filter(p=>!gs.includes(p.n)&&(norm(p.n).includes(q)||(p.a||[]).some(a=>norm(a).startsWith(q)))).slice(0,6).map(p=>({n:p.n,sub:p.club}));},guess);
  }
  function guess(raw){
    const p=find(raw);
    if(!p){draw("No tengo a ese jugador en la lista. Elige uno de las sugerencias.");return;}
    if(gs.includes(p.n)){draw("Ya lo has probado.");return;}
    gs.push(p.n);progSet(day,"mist",{gs});
    if(p.n===T.n){over=true;draw("");finish(SC[gs.length-1],`Era ${T.n}, en ${gs.length} intento${gs.length===1?"":"s"}`);return;}
    if(gs.length>=MAXT){over=true;draw("");finish(0,`Era ${T.n}`);return;}
    draw("");
  }
  function finish(score,line){
    stopTimer();recordScore(day,"mist",score);$("#gsc").textContent="";
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center;margin-top:14px">${esc(line)}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(gs.includes(T.n)){over=true;draw("");finish(SC[gs.length-1],`Era ${T.n}`);}
  else if(gs.length>=MAXT){over=true;draw("");finish(0,`Era ${T.n}`);}
  else draw("");
}

(function(){
  const standalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  const KEY="minijuegos.installDismiss";
  const dismissed=()=>{try{return localStorage.getItem(KEY)==="1";}catch(e){return false;}};
  let deferred=null,text="";
  window.installBarHtml=function(){
    if(standalone()||dismissed()||!text)return "";
    return `<div class="install" id="install"><span class="msg">${text}</span>${deferred?`<button class="btn" id="installBtn" type="button">Instalar</button>`:""}<button class="x" id="installX" type="button" aria-label="Cerrar">✕</button></div>`;
  };
  window.bindInstallBar=function(){
    const b=document.getElementById("installBtn"),x=document.getElementById("installX");
    if(b)b.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;text="";show("hoy");};
    if(x)x.onclick=()=>{try{localStorage.setItem(KEY,"1");}catch(e){}text="";const e=document.getElementById("install");if(e)e.remove();};
  };
  function refresh(){const v=document.querySelector(".view.on");if(v&&v.id==="v-hoy"&&!document.getElementById("game").classList.contains("on"))renderHoy();}
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;text="Instala la app: se abre con un toque y funciona sin conexión.";refresh();});
  window.addEventListener("appinstalled",()=>{text="";refresh();});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){text="Para instalarla en el iPhone: toca el botón Compartir (o el menú ⋯ en Chrome) y elige «Añadir a pantalla de inicio».";refresh();}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)document.getElementById("upd").hidden=false;});
    document.getElementById("updBtn").onclick=()=>location.reload();
  }
})();
