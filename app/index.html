<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minijuegos de fútbol</title>
<style>
:root{--bg:#090e1b;--bg2:#0e1527;--card:#131c33;--card2:#19244a;--line:#243053;--txt:#eef2ff;--mut:#8f9bc2;--mm:#ff6b4a;--once:#2ee6c5;--top:#3ddc84;--gold:#f2c14e;--gold2:#ffd978;--bad:#ff5470;--ok:#3ddc84;--r1:12px;--r2:18px;--r3:26px;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{background:radial-gradient(120% 60% at 50% -10%,#16224a 0,rgba(9,14,27,0) 60%) no-repeat,var(--bg)}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:0}
h2{font-size:15px;letter-spacing:.01em;font-weight:700;color:var(--mut);margin:26px 0 10px}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;white-space:nowrap}
.streak svg{width:17px;height:17px;color:var(--gold);fill:rgba(242,193,78,.18);stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.gcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px 12px 12px;margin:8px 0;box-shadow:var(--sh);transition:transform .12s,border-color .12s;text-decoration:none;color:inherit}
.gcard:active{transform:scale(.985)}
.gcard:hover{border-color:color-mix(in srgb,var(--c,var(--line)) 55%,var(--line))}
.gcard .ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--bg2));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.gcard .ic svg,.ic2 svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gcard .tx{min-width:0;flex:1}
.gcard b{display:block;font-size:16px;font-weight:700;letter-spacing:-.005em}
.gcard small{display:block;color:var(--mut);font-size:13px;line-height:1.3;margin-top:2px}
.gcard .pill{margin-left:auto;flex:none;font-weight:800;font-size:14px;color:#1b1500;background:var(--c);border-radius:999px;padding:7px 13px}
.gcard .pill.done{background:transparent;color:var(--txt);border:1px solid var(--line);padding:6px 12px}
.gcard .pill.done i{font-style:normal;color:var(--mut);font-weight:600}
.gcard[disabled]{opacity:.5;cursor:default}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1500;border:0;border-radius:var(--r1);padding:13px 18px;font-weight:800;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px rgba(242,193,78,.18);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn:focus-visible,.tabs button:focus-visible,.gcard:focus-visible,.opt:focus-visible,.tile:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.block{display:block;width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,21,39,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;padding:6px 0 4px;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:var(--r1)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold)}
.tabs button.on svg{stroke-width:2.2}
.view{display:none}.view.on{display:block}
#game{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none}
#game.on{display:block}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(9,14,27,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid var(--line)}
.ghead .x{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--mut);padding:0}
.ghead .x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.ghead .t{font-weight:800;flex:1;font-size:15px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead #gsc{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--c,var(--gold));width:0;transition:width .3s}
/* mas o menos */
.q{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-align:center;margin:14px 0}
.duel{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);transition:transform .1s,border-color .12s;padding:22px 14px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.opt{min-width:0}.opt b{font-size:22px;overflow-wrap:anywhere;hyphens:auto;line-height:1.2}.opt.long b{font-size:17px}
.opt .v{font-weight:900;min-height:38px;line-height:1.1;overflow-wrap:anywhere}.opt .v .vn{font-size:30px}.opt .v .vu{font-size:14px;font-weight:700;color:var(--mut);display:block;margin-top:2px}
.opt.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.lose{border-color:var(--line);opacity:.65}
.opt.pickbad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card));opacity:1}
.vs{text-align:center;color:var(--mut);font-weight:800}
/* once oculto */
.pitch{background:linear-gradient(#0f5a36,#0c4a2d);border:2px solid #1f8a57;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;gap:14px;margin:12px 0}
.prow{display:flex;justify-content:space-around;gap:6px}
.slot{width:0;flex:1;max-width:96px;min-height:58px;border-radius:12px;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.slot small{opacity:.7;font-size:10px}
.slot.got{background:var(--once);color:#04231c;border:1px solid var(--once);font-weight:800}
.slot.miss{background:rgba(255,84,112,.3);border:1px solid var(--bad)}
.gk{align-self:center}
.inp{display:flex;gap:8px;position:relative}
.inp input{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r1);padding:14px;color:var(--txt);font:inherit;min-width:0}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;z-index:4;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.sug button small{color:var(--mut);margin-left:6px}
.lives{font-size:20px;letter-spacing:2px}
.fb{min-height:22px;margin:8px 0;font-weight:700}
.big{font-size:64px;line-height:1;font-weight:900;letter-spacing:-.03em;text-align:center;margin:10px 0 14px;color:var(--gold);font-variant-numeric:tabular-nums}
.big::after{content:"";display:block;width:56px;height:3px;border-radius:3px;background:var(--gold);opacity:.5;margin:12px auto 0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--txt);color:#0a0f1c;box-shadow:0 8px 24px rgba(0,0,0,.4);border-radius:999px;padding:10px 16px;font-weight:700;z-index:30}
input.alias{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:inherit;margin:6px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:10px;color:var(--mut)}
.seg button.on{background:var(--line);color:var(--txt);font-weight:700}
.install{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 0;padding:10px 14px;border:1px solid var(--gold);border-radius:14px;background:var(--card)}
.install .msg{flex:1 1 200px;font-size:14px}
.install .x{background:none;border:0;color:var(--mut);font-size:18px}
.upd{position:fixed;left:12px;right:12px;bottom:84px;z-index:40;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;border:1px solid var(--gold);border-radius:14px;background:var(--bg2);box-shadow:0 6px 24px #0008}
.opt.sm{min-height:0;padding:16px 12px}
.tl{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.tli{display:flex;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:11px 13px}
.tli b{color:var(--gold);min-width:44px;font-variant-numeric:tabular-nums}
.cgrp{border-radius:12px;padding:10px 12px;margin:8px 0;color:#141414;display:flex;flex-direction:column;gap:2px}
.cgrp span{font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:700;font-size:13px;min-height:64px;overflow-wrap:anywhere;color:var(--txt)}
.tile.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--card))}
.btn[disabled]{opacity:.45;cursor:default}
.mhead,.mcs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.mhead{font-size:11px;color:var(--mut);text-align:center;margin:10px 0 4px}
.mrow{margin:6px 0}.mn{font-weight:800;font-size:14px;margin-bottom:2px}
.mc{border-radius:8px;padding:6px 3px;text-align:center;font-size:10.5px;line-height:1.15;font-weight:700;min-height:48px;min-width:0;display:flex;align-items:center;justify-content:center;overflow-wrap:break-word;word-break:normal;hyphens:auto;background:#2a3560}
.mc.ok{background:#1f9d5b;color:#fff}.mc.near{background:#d98a1f;color:#fff}
.code{font:800 26px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center}
/* marcador de la jornada (pantalla Hoy) */
.board{margin:16px 0 8px;padding:16px;border-radius:var(--r3);background:linear-gradient(160deg,#18265a 0,#101a38 70%);border:1px solid #2b3a74;box-shadow:var(--sh)}
.board .bd{font-size:13px;color:var(--mut);font-weight:600}
.board .bt{display:flex;align-items:baseline;gap:6px;margin:2px 0 12px}
.board .bt b{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.03em}
.board .bt small{color:var(--mut);font-size:16px;font-weight:700}
.pips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.pip{height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
.pip.on{background:var(--c)}
.board .bm{margin-top:10px;font-size:13px;color:var(--mut)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 6px}
.sec h2{margin:0}
.sec span{font-size:12.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:13.5px;font-weight:700}
.chip.ok{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.chip.new{opacity:.7;padding:7px 10px;border-style:dashed}
.chip svg{width:16px;height:16px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip i{font-style:normal;color:var(--mut);font-weight:600}
.photo{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px;margin:12px 0}
.photo img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--card2);flex:none}
.photo .ph{width:72px;height:72px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--mut);flex:none}
.photo b{display:block}
.photo small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3;margin-top:2px}
.help{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;margin:12px 0;font-size:14.5px}
.help b{display:block;margin-bottom:4px}
.qbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;color:var(--mut);font-weight:800}
.upd{border-radius:var(--r2)}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;object-fit:cover;background:var(--card2);border:1px solid var(--line);font-weight:800;color:var(--mut);overflow:hidden}
.av svg{width:56%;height:56%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(3,6,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3) var(--r3) 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.x2{background:var(--card);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--mut);padding:0}
.x2 svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avb{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--txt);padding:0}
.avb svg{width:60%;height:60%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avb.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.avcol{display:flex;gap:10px;justify-content:center;margin-top:14px}
.avc{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.avc.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg2) inset}
.prof .btn{margin-top:12px}
.btn svg,.av svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av svg{width:58%;height:58%}
.stp{display:flex;align-items:center;gap:10px}.stp b{min-width:26px;text-align:center;font-size:24px}.stp .btn{padding:8px 16px;font-size:20px;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="app">
 <section class="view on wrap" id="v-hoy"></section>
 <section class="view wrap" id="v-juegos"></section>
 <section class="view wrap" id="v-ligas"></section>
 <section class="view wrap" id="v-perfil"></section>
</div>
<div id="game"></div>
<div class="upd" id="upd" hidden role="status"><span>Hay una versión nueva.</span><button class="btn" id="updBtn" type="button">Recargar</button></div>
<nav class="tabs" id="tabs">
 <button data-v="hoy" data-i="cal" class="on">Hoy</button>
 <button data-v="juegos" data-i="game">Juegos</button>
 <button data-v="ligas" data-i="top">Ligas</button>
 <button data-v="perfil" data-i="user">Perfil</button>
</nav>

  kind:"supabase",

  async auth(){
    if(this.tok&&this.tok.access_token&&this.tok.exp>Date.now()/1000+60)return;
    let r;
    if(this.tok&&this.tok.refresh_token){
      r=await fetch(SB.supabaseUrl+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:this.tok.refresh_token})});

    if(!r.ok)throw new Error("No se pudo conectar con el servidor");
    const j=await r.json();
    this.tok={access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)};

async function flushPending(){
  if(Backend.kind==="local"||!S.alias)return;
  const rest=[];
  for(const p of S.pending){try{await Backend.submit(p.day,p.game,p.score);}catch(e){rest.push(p);}}
  S.pending=rest;save();
}

function scoreOf(day,game){ const a=(S.days[day]||{})[game]; return a!=null?a:(S.arch[day]||{})[game]; }   /* lo jugado el propio día manda sobre el archivo */
/* Partida en curso: se guarda tras cada jugada, así cerrar y reabrir continúa donde estabas y no permite repetir */
function progGet(day,game){ return (S.prog||{})[day+"|"+game]||null; }
function progSet(day,game,o){ (S.prog=S.prog||{})[day+"|"+game]=o; save(); }
function recordScore(day,game,score){
  if(S.prog)delete S.prog[day+"|"+game];
  if(scoreOf(day,game)!=null){save();return;}
  if(day===today())return recordDaily(game,score);
  (S.arch[day]=S.arch[day]||{})[game]=score;save();     /* el archivo no cuenta para liga ni racha */
}
function recordDaily(game,score){
  const t=today();
  S.days[t]=S.days[t]||{};
  if(S.days[t][game]!=null)return;              /* el primer resultado del día es el que cuenta */
  S.days[t][game]=score;
  if(!(GAMES.find(x=>x.id===game)||{}).beta)S.pending.push({day:t,game,score});   /* los juegos en pruebas no cuentan en las ligas */
  save();flushPending();
}

/* avatar: 'p:<icono>:<color>' (prediseñado), 'data:image/jpeg;base64,...' (foto de la galeria reducida) o vacio (iniciales) */
function avatarHtml(a,size,name){
  size=size||40;
  if(typeof a==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a))return `<img class="av" width="${size}" height="${size}" style="width:${size}px;height:${size}px" src="${a}" alt="">`;
  const m=typeof a==="string"&&a.match(/^p:([a-z]{2,12}):(\d{1,2})$/);
  if(m&&ICONS[m[1]]){const c=AV_COLORS[+m[2]%AV_COLORS.length];return `<span class="av" style="width:${size}px;height:${size}px;color:${c};background:color-mix(in srgb,${c} 18%,var(--bg2));border-color:color-mix(in srgb,${c} 45%,transparent)">${svg(m[1])}</span>`;}
  const ini=String(name||"?").split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase()||"?";
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${esc(ini)}</span>`;
}
function resizeToAvatar(file){                       /* foto de la galeria -> cuadrado 96x96 JPEG */
  return new Promise((ok,ko)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=96;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
      URL.revokeObjectURL(url);
      let q=.78,d=c.toDataURL("image/jpeg",q);while(d.length>12000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q);}
      d.length>13500?ko(new Error("Imagen demasiado grande")):ok(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error("No se pudo leer la imagen"));};
    img.src=url;
  });
}

/* ---------- Más o menos ---------- */
function mmRounds(seed,n){
  const r=rng(seed),sets=DATA.MM,out=[];let last=-1;
  for(let i=0;i<n;i++){
    const target=3.2-i*(2.2/(n-1));           /* de pares muy distintos a pares ajustados */
    let best=null;
    for(let k=0;k<50;k++){
      let si=Math.floor(r()*sets.length);if(si===last&&sets.length>1)si=(si+1)%sets.length;
      const s=sets[si];let a=Math.floor(r()*s.items.length),b=Math.floor(r()*s.items.length);
      if(a===b)continue;
      const A=s.items[a],B=s.items[b],ratio=Math.max(A.v,B.v)/Math.max(1,Math.min(A.v,B.v));
      const d=Math.abs(Math.log(ratio)-Math.log(target));
      if(!best||d<best.d)best={d,s,A,B};
    }
    last=sets.indexOf(best.s);out.push(best);
  }
  return out;
}
function fmt(n){return n.toLocaleString("es-ES");}
function playMM(day){
  const hoy=day===today();
  openGame("Más o menos"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--mm)");
  const N=10,rounds=mmRounds(hash("mm"+day),N);
  let sv=progGet(day,"mm");
  if(!sv){ sv={i:0,hits:0,t0:Date.now()}; progSet(day,"mm",sv); }
  if(sv.hits==null) sv.hits=(sv.score||0)/10;
  let i=sv.i,hits=sv.hits,locked=false,cur=null,done=false,label="";
  const t0=sv.t0||Date.now();
  const remaining=()=>hoy?T_MM-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{ $("#gsc").textContent=(hoy?"⏱ "+fmtT(remaining())+" · ":"")+label; };
  function next(){
    cur=rounds[i];locked=false;
    const flip=rng(hash("f"+day+i))()<.5;
    const [X,Y]=flip?[cur.B,cur.A]:[cur.A,cur.B];cur.X=X;cur.Y=Y;
    label="Duelo "+(i+1)+"/"+N;hud();
    $("#gb").innerHTML=`<div class="bar" style="--c:var(--mm)"><i style="width:${i/N*100}%"></i></div>
    <div class="mut" style="text-align:center">${esc(cur.s.cat)}</div><div class="q">${esc(cur.s.q)}</div>
    <div class="duel"><button class="opt${X.n.length>22?" long":""}" data-o="0"><b>${esc(X.n)}</b><div class="v"></div></button><div class="vs">o</div><button class="opt${Y.n.length>22?" long":""}" data-o="1"><b>${esc(Y.n)}</b><div class="v"></div></button></div>
    <div class="mut" style="text-align:center;margin-top:10px;font-size:13px">${esc(cur.s.asof||"")}</div><div id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  }
  function pick(o){
    if(locked||done)return;locked=true;
    const pickV=[cur.X,cur.Y][o],other=[cur.X,cur.Y][1-o],ok=pickV.v>other.v;
    const opts=document.querySelectorAll(".opt");
    [cur.X,cur.Y].forEach((it,k)=>{opts[k].querySelector(".v").innerHTML=`<span class="vn">${esc(fmt(it.v))}</span> <small class="vu">${esc(cur.s.unit)}</small>`;opts[k].classList.add(it.v>(k?cur.X:cur.Y).v?"win":"lose");});
    if(!ok)opts[o].classList.add("pickbad");
    if(ok)hits++;
    progSet(day,"mm",{i:i+1,hits,t0});                   /* si cierras aquí, continúas en el duelo siguiente */
    label=hits+" acierto"+(hits===1?"":"s");hud();
    $("#nx").innerHTML=`<button class="btn block" style="margin-top:14px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;if(i>=N)end(false);else next();};
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    const rem=timeout?0:Math.max(0,remaining());
    const bonus=hoy?timeBonus(hits,rem,T_MM):0,score=hits*(hoy?9:10)+bonus;
    recordScore(day,"mm",score);
    $("#gsc").textContent="";
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:30px">${timeout?"Se acabó el tiempo. ":""}Has acertado ${hits} de ${N}${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(i>=N)end(false);
  else if(remaining()<=0)end(true);
  else{ next(); if(hoy)TIMER=setInterval(()=>{ if(remaining()<=0)end(true); else hud(); },250); }
}

/* ---------- Once oculto ---------- */
const PLAYERS={state:"idle",list:[]};
async function loadPlayers(){
  if(PLAYERS.state!=="idle")return;PLAYERS.state="loading";
  try{const r=await fetch("../top10/entidades/jugadores.json");if(!r.ok)throw 0;PLAYERS.list=(await r.json()).map(x=>({n:x[0],nk:norm(x[0]),sub:[x[1],x[2]||""].filter(Boolean).join(" · "),f:x[3]||60}));PLAYERS.state="ready";}catch(e){PLAYERS.state="failed";}
}
loadPlayers();
function lineupOfDay(d){const order=shuffled(DATA.LINEUPS,rng(20260930));return order[dayNum(d)%order.length];}
function rowLabel(r,R){return r===0?"Defensa":r===R-1?"Delantero":"Medio";}
function keysOf(L,a){const s=new Set([norm(a.n)]);(a.a||[]).forEach(x=>s.add(norm(x)));if(L.auto){const t=norm(a.n).split(" "),l=t[t.length-1];if(l.length>=4)s.add(l);}return [...s].filter(Boolean);}
function judge(L,raw,found){
  const q=norm(raw);if(!q)return {t:"empty"};
  let near=-1;
  for(let i=0;i<L.ans.length;i++){
    const ks=L.ans[i].keys;
    if(ks.includes(q))return found.has(i)?{t:"dup",i}:{t:"hit",i};
  }
  for(let i=0;i<L.ans.length;i++){
    if(found.has(i))continue;
    for(const k of L.ans[i].keys){const tol=k.length>=10?2:k.length>=6?1:0;if(tol&&lev(q,k)<=tol&&q.length>=4)near=i;}
  }
  return near>=0?{t:"hit",i:near}:{t:"miss"};
}
let _extra=null;
function allNames(){                                   /* base de jugadores + respuestas de todas las alineaciones que falten (sin delatar las del día) */
  if(_extra&&_extra.n===PLAYERS.list.length)return _extra.l;
  const have=new Set(PLAYERS.list.map(e=>e.nk)),add=[];
  DATA.LINEUPS.forEach(L=>L.ans.forEach(a=>{const nk=norm(a.n);if(!have.has(nk)){have.add(nk);add.push({n:a.n,nk,sub:"",f:50});}}));
  _extra={n:PLAYERS.list.length,l:PLAYERS.list.concat(add)};return _extra.l;
}
function suggestP(raw,found,L){
  const q=norm(raw);if(q.length<2)return [];
  const got=new Set([...found].map(i=>norm(L.ans[i].n)));
  const out=[];
  for(const e of allNames()){
    if(got.has(e.nk))continue;
    let s=-1;if(e.nk.startsWith(q))s=0;else if(e.nk.indexOf(" "+q)>=0)s=1;else if(q.length>=3&&e.nk.includes(q))s=2;
    if(s>=0)out.push({e,s});
  }
  out.sort((x,y)=>x.s-y.s||y.e.f-x.e.f||x.e.nk.length-y.e.nk.length);
  return out.slice(0,6).map(x=>x.e);
}
function playOnce(day){
  const hoy=day===today();
  openGame("Once oculto"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--once)");
  let L=lineupOfDay(day);
  L=Object.assign({},L);L.ans=L.ans.map(a=>Object.assign({keys:keysOf(L,a)},a));
  let svo=progGet(day,"once");
  const t0=(svo&&svo.t0)||Date.now();
  const remaining=()=>hoy?T_ONCE-(Date.now()-t0)/1000:Infinity;
  let timedOut=false;
  const found=new Set(svo?svo.f:[]),MAXL=5;let lives=svo?svo.l:MAXL,over=!!svo&&(svo.l<=0||svo.f.length===10),slotOf=[],k=0;
  if(!over&&hoy&&remaining()<=0){over=true;timedOut=true;}
  /* cada respuesta ocupa su hueco según el orden de la formación (de defensa a ataque) */
  L.rows.forEach((n,r)=>{for(let j=0;j<n;j++)slotOf.push({r,j,idx:k++});});
  const R=L.rows.length;
  function draw(msg){
    progSet(day,"once",{f:[...found],l:lives,t0});
    const rowsHtml=[];
    for(let r=R-1;r>=0;r--){
      rowsHtml.push(`<div class="prow">${slotOf.filter(s=>s.r===r).map(s=>{const a=L.ans[s.idx],g=found.has(s.idx);return `<div class="slot ${g?"got":over?"miss":""}">${(g||over)?esc(a.n):`?<small>${rowLabel(r,R)}</small>`}</div>`;}).join("")}</div>`);
    }
    const hearts="❤️".repeat(lives)+"🖤".repeat(MAXL-lives);
    $("#gsc").innerHTML=`${hoy?`<span id="tmr">⏱ ${fmtT(remaining())}</span> `:""}<span class="lives">${hearts}</span>`;
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;font-size:14px">${esc(L.title.replace(/^Jugadores de campo titulares d(e|el) /,""))}</div>
    <div class="pitch">${rowsHtml.join("")}<div class="prow"><div class="slot gk got" style="width:auto;max-width:none;flex:0 0 auto;min-height:0;padding:8px 18px;font-size:14px;white-space:nowrap;background:#fff;color:#111">🧤 ${esc(L.gk||"Portero")}</div></div></div>
    <div class="mut" style="text-align:center;margin-bottom:6px">${found.size}/10 jugadores · escribe el apellido o el nombre</div>
    ${over?"":`<div class="inp"><input id="gi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Jugador de campo..."><button class="btn" id="gs">OK</button><div class="sug" id="sg" style="display:none"></div></div>`}
    ${over?"":`<button class="btn ghost block" id="giveup" style="margin-top:8px">Rendirme</button>`}
    <div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over){
      $("#giveup").onclick=()=>{if(confirm("¿Rendirte? Te quedas con "+found.size+" acierto"+(found.size===1?"":"s")+".")){lives=0;over=true;draw("Te has rendido");}};
      const inp=$("#gi");
      const submit=v=>{const val=(v??inp.value);if(!val.trim())return;try2(val);};
      $("#gs").onclick=()=>submit();
      inp.onkeydown=e=>{if(e.key==="Enter")submit();};
      inp.oninput=()=>{const s=suggestP(inp.value,found,L),box=$("#sg");if(!s.length){box.style.display="none";return;}box.style.display="block";box.innerHTML=s.map((e,n)=>`<button data-n="${n}">${esc(e.n)}<small>${esc(e.sub)}</small></button>`).join("");box.querySelectorAll("button").forEach((b,n)=>b.onclick=()=>submit(s[n].n));};
      inp.focus();
    }
    if(over)finish();
  }
  function try2(v){
    const j=judge(L,v,found);
    if(j.t==="hit"){found.add(j.i);if(found.size===10){over=true;return draw("¡Completo!");}return draw("✔ "+esc(L.ans[j.i].n));}
    if(j.t==="dup")return draw("Ya lo tenías");
    lives--;if(lives<=0){over=true;return draw("Sin vidas");}
    draw("✘ No juega de titular (o no lo reconozco). Pierdes una vida.");
  }
  function finish(){
    stopTimer();
    const rem=timedOut?0:Math.max(0,remaining()),bonus=hoy?timeBonus(found.size,rem,T_ONCE):0;
    const score=found.size*(hoy?9:10)+bonus;
    recordScore(day,"once",score);
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center">${timedOut?"Se acabó el tiempo. ":""}${found.size} de 10${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}
    <button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  draw(timedOut?"Se acabó el tiempo":"");
  if(hoy&&!over)TIMER=setInterval(()=>{
    if(over){stopTimer();return;}
    if(remaining()<=0){timedOut=true;over=true;draw("Se acabó el tiempo");return;}
    const t=document.getElementById("tmr");if(t)t.textContent="⏱ "+fmtT(remaining());
  },250);
}

/* Ayudas comunes */
function chunkOfDay(bank,n,day){                       /* n elementos consecutivos de un orden fijo, según el día */
  const order=shuffled(bank,rng(20260930)),len=order.length,start=(dayNum(day)*n)%len,out=[];
  for(let k=0;k<n;k++)out.push(order[(start+k)%len]);
  return out;
}
function meta(id){return GAMES.find(x=>x.id===id);}
function endScreen(day,id,score,line){
  const hoy=day===today();
  stopTimer();recordScore(day,id,score);
  $("#gsc").textContent="";

  ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
  const a=$("#e1");if(a)a.onclick=()=>share(shareText());
  $("#e2").onclick=closeGame;
}
function runClock(fn){stopTimer();TIMER=setInterval(fn,250);}
const INPUT_HTML=`<div class="inp"><input id="gi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe un jugador..."><button class="btn" id="gs">OK</button><div class="sug" id="sg" style="display:none"></div></div>`;
function bindNameInput(sugFn,onSubmit){
  const inp=$("#gi"),box=$("#sg");
  const submit=v=>{const val=(v??inp.value);if(!val.trim())return;onSubmit(val);};
  $("#gs").onclick=()=>submit();
  inp.onkeydown=e=>{if(e.key==="Enter")submit();};
  inp.oninput=()=>{const s=sugFn(inp.value);if(!s.length){box.style.display="none";return;}box.style.display="block";box.innerHTML=s.map((e,n)=>`<button data-n="${n}">${esc(e.n)}<small>${esc(e.sub||"")}</small></button>`).join("");box.querySelectorAll("button").forEach((b,n)=>b.onclick=()=>submit(s[n].n));};
  inp.focus();
}
function suggestAny(raw,skip){                          /* sugerencias de la base de jugadores */
  const q=norm(raw);if(q.length<2)return [];
  const out=[];
  for(const e of allNames()){
    if(skip&&skip.has(e.nk))continue;
    let s=-1;if(e.nk.startsWith(q))s=0;else if(e.nk.indexOf(" "+q)>=0)s=1;else if(q.length>=3&&e.nk.includes(q))s=2;
    if(s>=0)out.push({e,s});
  }
  out.sort((x,y)=>x.s-y.s||y.e.f-x.e.f||x.e.nk.length-y.e.nk.length);
  return out.slice(0,6).map(x=>x.e);
}
function matchesName(raw,target){                       /* target: {n,a:[]} */
  const q=norm(raw);if(!q)return false;
  const ks=new Set([norm(target.n),...(target.a||[]).map(norm)]);
  const t=norm(target.n).split(" ");if(t[t.length-1].length>=4)ks.add(t[t.length-1]);
  for(const k of ks){if(k===q)return true;const tol=k.length>=10?2:k.length>=6?1:0;if(tol&&q.length>=4&&lev(q,k)<=tol)return true;}
  return false;
}

/* ---------- Verdadero o falso y El intruso (motor común de preguntas) ---------- */
function playQuiz(id,day,cfg){
  const hoy=day===today(),g=meta(id),N=10;
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const items=chunkOfDay(cfg.bank,N,day);
  let sv=progGet(day,id);
  if(!sv){sv={i:0,hits:0,t0:Date.now()};progSet(day,id,sv);}
  let i=sv.i,hits=sv.hits,locked=false,done=false,label="";
  const t0=sv.t0,rem=()=>hoy?cfg.T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=(hoy?"⏱ "+fmtT(rem())+" · ":"")+label;};
  function next(){
    const it=items[i];locked=false;label=(i+1)+"/"+N;hud();
    $("#gb").innerHTML=`<div class="bar" style="--c:${g.c}"><i style="width:${i/N*100}%"></i></div>${cfg.render(it)}
    <div class="duel" style="margin-top:14px">${cfg.options(it).map((o,k)=>`<button class="opt sm" data-o="${k}"><b>${esc(o)}</b></button>`).join("")}</div><div id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  }
  function pick(k){
    if(locked||done)return;locked=true;
    const it=items[i],right=cfg.correct(it),ok=k===right,opts=document.querySelectorAll(".opt");
    opts.forEach((b,n)=>b.classList.add(n===right?"win":"lose"));
    if(!ok)opts[k].classList.add("pickbad");
    if(ok)hits++;
    progSet(day,id,{i:i+1,hits,t0});
    label=hits+" acierto"+(hits===1?"":"s");hud();
    $("#nx").innerHTML=`<div class="card" style="margin-top:12px;font-size:14px">${esc(cfg.explain(it))}</div><button class="btn block" style="margin-top:10px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;if(i>=N)end(false);else next();};
  }
  function end(timeout){
    if(done)return;done=true;
    const bonus=hoy?timeBonus(hits,timeout?0:Math.max(0,rem()),cfg.T):0,score=hits*(hoy?9:10)+bonus;
    endScreen(day,id,score,`${timeout?"Se acabó el tiempo. ":""}Has acertado ${hits} de ${N}${hoy?" · bonus de velocidad +"+bonus:""}`);
  }
  if(i>=N)end(false);else if(rem()<=0)end(true);
  else{next();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Motor de "ordenar y entregar" (Línea del tiempo y Reconstruye la tabla) ---------- */
function playOrder(id,day,cfg){
  const hoy=day===today(),g=meta(id),T=cfg.T;
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const puz=chunkOfDay(cfg.bank,1,day)[0],its=puz.items,N=its.length;
  const keyOf=k=>cfg.key(its[k]);
  const sortedK=its.map(i=>cfg.key(i)).sort((a,b)=>a-b);
  let sv=progGet(day,id);
  if(!sv||!sv.o){sv={o:shuffled(its.map((_,k)=>k),rng(hash(id+day))),t0:Date.now()};progSet(day,id,sv);}
  let ord=sv.o.slice(),done=false;
  const t0=sv.t0,rem=()=>hoy?T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=hoy?"⏱ "+fmtT(rem()):"";};
  function save(){progSet(day,id,{o:ord,t0});}
  function draw(){
    hud();
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">${esc(puz.title)}</div>
    <div class="q" style="font-size:17px">${esc(cfg.prompt)}</div>
    <div class="tl">${ord.map((k,i)=>`<div class="tli" style="align-items:center"><span style="flex:1">${esc(its[k].t)}</span>
      <button class="btn ghost" style="padding:8px 12px" data-m="${i}|-1" ${i===0?"disabled":""} aria-label="Subir">▲</button>
      <button class="btn ghost" style="padding:8px 12px" data-m="${i}|1" ${i===N-1?"disabled":""} aria-label="Bajar">▼</button></div>`).join("")}</div>

/* ---------- Marcador exacto ---------- */
function playScore(day){
  const hoy=day===today(),g=meta("score"),N=10,T=240;
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const items=chunkOfDay(DATA.SCORE,N,day);
  let sv=progGet(day,"score");
  if(!sv){sv={i:0,pts:0,t0:Date.now()};progSet(day,"score",sv);}
  let i=sv.i,pts=sv.pts,done=false,a=0,b=0,checked=false;
  const t0=sv.t0,rem=()=>hoy?T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=(hoy?"⏱ "+fmtT(rem())+" · ":"")+pts+" pts";};
  const award=(it,x,y)=>{if(x===it.hg&&y===it.ag)return 10;if(Math.sign(it.hg-it.ag)!==Math.sign(x-y))return 0;return x-y===it.hg-it.ag?6:4;};
  function draw(){
    const it=items[i];hud();
    const row=(who,v,k)=>`<div class="tli" style="align-items:center"><span style="flex:1;font-weight:700">${esc(who)}</span><span class="stp"><button class="btn ghost" data-st="${k}-" ${checked?"disabled":""} aria-label="Menos">−</button><b>${v}</b><button class="btn ghost" data-st="${k}+" ${checked?"disabled":""} aria-label="Más">+</button></span></div>`;
    $("#gb").innerHTML=`<div class="bar" style="--c:${g.c}"><i style="width:${i/N*100}%"></i></div>
    <div class="mut" style="text-align:center">Partido ${i+1} de ${N}</div><div class="q">${esc(it.comp)}</div>
    <div class="tl">${row(it.home,a,"a")}${row(it.away,b,"b")}</div>
    <div class="mut" style="text-align:center;font-size:13px">${it.et?"Cuenta el resultado tras la prórroga (sin penaltis).":"Cuenta el resultado final."}</div>
    <div id="nx" style="margin-top:12px"></div>`;
    document.querySelectorAll("[data-st]").forEach(bt=>bt.onclick=()=>{const [k,d]=bt.dataset.st.split("");const dv=d==="+"?1:-1;if(k==="a")a=Math.max(0,Math.min(15,a+dv));else b=Math.max(0,Math.min(15,b+dv));draw();});
    if(checked)return reveal(it);
    $("#nx").innerHTML=`<button class="btn block" id="chk">Comprobar</button>`;
    $("#chk").onclick=()=>{checked=true;const p=award(it,a,b);pts+=p;progSet(day,"score",{i:i+1,pts,t0});draw();};
  }
  function reveal(it){
    const p=award(it,a,b);
    $("#nx").innerHTML=`<div class="card" style="text-align:center"><div class="mut">Resultado real</div><div class="big" style="font-size:40px;margin:4px 0">${it.hg} - ${it.ag}</div><div>${p===10?"¡Exacto! +10":p>0?"+"+p+(p===6?" (resultado y diferencia de goles)":" (aciertas quién gana o el empate)"):"+0"}</div>${it.pen?`<div class="mut" style="margin-top:6px;font-size:13px">Tanda de penaltis: ${esc(it.pen)}</div>`:""}<div class="mut" style="margin-top:6px;font-size:13px">${esc(it.note||"")}</div></div><button class="btn block" style="margin-top:10px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;checked=false;a=b=0;if(i>=N)end(false);else draw();};
  }
  function end(timeout){
    if(done)return;done=true;
    const score=hoy?Math.round(0.9*pts)+Math.round(10*(pts/100)*(timeout?0:Math.max(0,rem()))/T):pts;
    endScreen(day,"score",score,`${timeout?"Se acabó el tiempo. ":""}${pts} de 100 puntos posibles`);
  }
  if(i>=N)end(false);else if(rem()<=0)end(true);
  else{draw();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Camino a la final ---------- */
const SEL={state:"idle",list:[]};
async function loadSel(){
  if(SEL.state!=="idle")return;SEL.state="loading";
  try{const r=await fetch("../top10/entidades/selecciones.json");if(!r.ok)throw 0;SEL.list=(await r.json()).map(x=>x[0]);}catch(e){}
  DATA.ROAD.forEach(x=>{SEL.list.push(x.team);(x.alias||[]).forEach(a=>SEL.list.push(a));});
  SEL.list=[...new Set(SEL.list)];SEL.state="ready";
}
function suggestSel(raw){
  const q=norm(raw);if(q.length<2)return [];
  return SEL.list.map(n=>({n,k:norm(n)})).filter(x=>x.k.startsWith(q)||x.k.includes(" "+q)).slice(0,6).map(x=>({n:x.n,sub:""}));
}
function playRoad(day){
  const g=meta("road");
  openGame(g.name+(day===today()?" · hoy":" · "+dayLabel(day)),g.c);loadSel();
  const P=chunkOfDay(DATA.ROAD,1,day)[0],M=P.matches;
  let sv=progGet(day,"road");
  if(!sv){sv={shown:1,wrong:0,gs:[]};progSet(day,"road",sv);}
  let {shown,wrong}=sv,gs=sv.gs.slice(),over=false,ye="";
  const cost=()=>10*(shown-1)+10*wrong;
  const hud=()=>{$("#gsc").textContent="Vale "+Math.max(20,90-cost())+" pts";};
  const save=()=>progSet(day,"road",{shown,wrong,gs});
  const line=(m,k)=>`<div class="tli"><b style="min-width:112px;font-size:13px">${esc(m.r)}</b><span>Selección misteriosa <b style="color:var(--txt)">${esc(m.s)}</b> ${esc(m.opp)}${m.pen?` <span class="mut">(penaltis ${esc(m.pen)})</span>`:""}</span></div>`;
  function draw(msg){
    hud();
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">${esc(P.comp)}: ¿qué selección es y en qué año?</div>
    <div class="tl">${M.slice(0,shown).map(line).join("")}${shown<M.length?`<div class="tli mut"><span>${M.length-shown} partido${M.length-shown===1?"":"s"} más hasta el final</span></div>`:""}</div>
    ${over?"":`<button class="btn ghost block" id="rmore" ${shown>=M.length?"disabled":""}>Destapar otro partido (−10)</button>
    <input class="alias" id="gy" inputmode="numeric" maxlength="4" placeholder="Año (opcional, +10)" value="${esc(ye)}" style="margin-top:12px">
    <div class="inp"><input id="gi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Selección"><button class="btn" id="gs">OK</button><div class="sug" id="sg" style="display:none"></div></div>`}
    ${gs.length?`<div class="mut" style="font-size:14px;margin-top:8px">Ya has probado: ${gs.map(esc).join(", ")}</div>`:""}
    <div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over){
      $("#rmore").onclick=()=>{if(shown<M.length){shown++;save();draw();}};
      $("#gy").oninput=e=>{ye=e.target.value;};
      bindNameInput(suggestSel,guess);
    }
  }
  function guess(raw){
    const y=($("#gy")?$("#gy").value:"").trim();ye=y;
    if(matchesName(raw,{n:P.team,a:P.alias||[]})){
      over=true;
      const base=Math.max(20,90-cost()),bonus=(+y===P.year)?10:0;
      draw(`¡Correcto! Era ${P.team} en ${P.year}.${y?(bonus?" Año acertado: +10.":" El año no era "+esc(y)+"."):""}`);
      const f=$("#fb");f.style.cssText="text-align:center;font-size:22px;font-weight:900;color:#fff;background:var(--ok);border-radius:16px;padding:12px;margin:10px 0";
      finish(base+bonus);return;
    }
    wrong++;gs.push(raw.trim());save();
    if(wrong>=3){over=true;draw(`Era ${P.team} en ${P.year}.`);finish(0);return;}
    draw("No es. Pierdes 10 puntos.");
  }
  function finish(score){
    stopTimer();recordScore(day,"road",score);$("#gsc").textContent="";
    const all=M.slice(shown);
    $("#endbox").innerHTML=`${all.length?`<div class="mut" style="margin-top:8px">Resto del camino</div><div class="tl">${all.map(line).join("")}</div>`:""}<div class="big">${score}/100</div><button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    $("#e2").onclick=closeGame;
  }
  if(wrong>=3){over=true;draw(`Era ${P.team} en ${P.year}.`);finish(0);}
  else draw("");
}

/* ---------- Conexiones ---------- */
function playCon(day){
  const hoy=day===today(),g=meta("con"),T=300,COL=["#f5d90a","#9be564","#5bb8ff","#b58cff"];
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const puz=chunkOfDay(DATA.CON,1,day)[0];
  const tiles=[];puz.groups.forEach((gr,gi)=>gr.items.forEach(t=>tiles.push({t,gi})));
  const order=shuffled(tiles,rng(hash("con"+day)));
  let sv=progGet(day,"con");
  if(!sv){sv={f:[],m:0,t0:Date.now()};progSet(day,"con",sv);}
  let found=sv.f.slice(),mist=sv.m,sel=new Set(),done=false,msg="";
  const t0=sv.t0,rem=()=>hoy?T-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{$("#gsc").textContent=(hoy?"⏱ "+fmtT(rem())+" · ":"")+"fallos "+mist+"/4";};
  const byDiff=gi=>puz.groups[gi].diff||gi+1;
  function draw(reveal){
    hud();
    const rest=order.filter(x=>!found.includes(x.gi));
    const groupsHtml=(reveal?puz.groups.map((_,gi)=>gi).filter(gi=>!found.includes(gi)).concat(found):found).map(gi=>`<div class="cgrp" style="background:${COL[byDiff(gi)-1]}"><b>${esc(puz.groups[gi].name)}</b><span>${puz.groups[gi].items.map(esc).join(", ")}</span></div>`).join("");
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">Encuentra los 4 grupos de 4</div>${groupsHtml}
    ${reveal?"":`<div class="cgrid">${rest.map((x,n)=>`<button class="tile ${sel.has(x.t)?"on":""}" data-t="${esc(x.t)}">${esc(x.t)}</button>`).join("")}</div>
    <div class="fb" id="fb">${msg}</div>
    <div class="row"><button class="btn ghost" id="cdes">Deseleccionar</button><button class="btn" id="cok" ${sel.size===4?"":"disabled"}>Comprobar</button></div>`}`;
    if(!reveal){
      document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(sel.has(t))sel.delete(t);else if(sel.size<4)sel.add(t);draw();});
      $("#cdes").onclick=()=>{sel.clear();msg="";draw();};
      $("#cok").onclick=check;
    }
  }
  function save(){progSet(day,"con",{f:found,m:mist,t0});}
  function check(){
    if(done||sel.size!==4)return;
    const chosen=order.filter(x=>sel.has(x.t)),counts={};
    chosen.forEach(x=>counts[x.gi]=(counts[x.gi]||0)+1);
    const top=Math.max(...Object.values(counts)),gi=+Object.keys(counts).find(k=>counts[k]===top);
    if(top===4){found.push(gi);msg="";sel.clear();}
    else{mist++;msg=top===3?"Casi: tres son del mismo grupo.":"Esos cuatro no forman un grupo.";}
    save();
    if(found.length===4)end(false);
    else if(mist>=4)end(false);
    else draw();
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    const n=found.length;
    let score;
    if(hoy){const base=Math.max(0,Math.round(22.5*n)-5*mist);score=base+Math.round(10*(base/90)*(timeout?0:Math.max(0,rem()))/T);}
    else score=Math.max(0,Math.round(25*n-5*mist));
    draw(true);
    recordScore(day,"con",score);$("#gsc").textContent="";
    const line=`${timeout?"Se acabó el tiempo. ":mist>=4&&n<4?"Sin fallos disponibles. ":""}${n} de 4 grupos, ${mist} fallo${mist===1?"":"s"}`;
    $("#gb").insertAdjacentHTML("beforeend",`<div class="mut" style="text-align:center;margin-top:16px">${line}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`);
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(found.length===4||mist>=4)end(false);
  else if(rem()<=0)end(true);
  else{draw();if(hoy)runClock(()=>{if(rem()<=0)end(true);else hud();});}
}

/* ---------- Jugador misterioso ---------- */
function playMist(day){
  const hoy=day===today(),g=meta("mist"),MAXT=6,SC=[100,85,70,55,40,25];
  openGame(g.name+(hoy?" · hoy":" · "+dayLabel(day)),g.c);
  const list=DATA.MIST.players,pool=list.filter(p=>p.fame>=3);
  const T=chunkOfDay(pool,1,day)[0];
  let sv=progGet(day,"mist");
  if(!sv){sv={gs:[]};progSet(day,"mist",sv);}
  const gs=sv.gs.slice();let over=false;
  const find=raw=>{const q=norm(raw);if(!q)return null;
    return list.find(p=>matchesName(raw,p))||null;};
  const cell=(ok,txt,extra)=>`<div class="mc ${ok}">${esc(txt)}${extra||""}</div>`;
  function row(p){
    const dy=T.born-p.born;
    return `<div class="mrow"><div class="mn">${esc(p.n)}</div><div class="mcs">
      ${cell(p.country===T.country?"ok":"no",p.country)}${cell(p.league===T.league?"ok":"no",p.league)}${cell(p.club===T.club?"ok":"no",p.club)}${cell(p.pos===T.pos?"ok":"no",p.pos)}
      ${cell(dy===0?"ok":Math.abs(dy)<=2?"near":"no",String(p.born)," "+(dy>0?"↑":dy<0?"↓":""))}</div></div>`;
  }
  const hud=()=>{$("#gsc").textContent="Intento "+Math.min(gs.length+1,MAXT)+"/"+MAXT;};
  function draw(msg){
    hud();
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:8px">Adivina el jugador. Verde: coincide. Naranja: año cercano. Flecha: el secreto nació antes (↓) o después (↑).</div>
    <div class="mhead"><span>País</span><span>Liga</span><span>Club</span><span>Puesto</span><span>Nació</span></div>
    ${gs.map(n=>row(list.find(p=>p.n===n))).join("")}
    ${over?"":INPUT_HTML}<div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over)bindNameInput(raw=>{const q=norm(raw);if(q.length<2)return [];return list.filter(p=>!gs.includes(p.n)&&(norm(p.n).includes(q)||(p.a||[]).some(a=>norm(a).startsWith(q)))).slice(0,6).map(p=>({n:p.n,sub:p.club}));},guess);
  }
  function guess(raw){
    const p=find(raw);
    if(!p){draw("No tengo a ese jugador en la lista. Elige uno de las sugerencias.");return;}
    if(gs.includes(p.n)){draw("Ya lo has probado.");return;}
    gs.push(p.n);progSet(day,"mist",{gs});
    if(p.n===T.n){over=true;draw("");finish(SC[gs.length-1],`Era ${T.n}, en ${gs.length} intento${gs.length===1?"":"s"}`);return;}
    if(gs.length>=MAXT){over=true;draw("");finish(0,`Era ${T.n}`);return;}
    draw("");
  }
  function finish(score,line){
    stopTimer();recordScore(day,"mist",score);$("#gsc").textContent="";
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center;margin-top:14px">${esc(line)}</div><div class="big">${score}/100</div>${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;showPhoto(T.n);
  }
  if(gs.includes(T.n)){over=true;draw("");finish(SC[gs.length-1],`Era ${T.n}`);}
  else if(gs.length>=MAXT){over=true;draw("");finish(0,`Era ${T.n}`);}
  else draw("");
}

async function loadPhotos(){
  if(PHOTOS.state!=="idle")return;PHOTOS.state="loading";
  try{const r=await fetch("fotos/index.json");if(r.ok){const j=await r.json();for(const k in j){const e=Object.assign({k},j[k]);PHOTOS.map[norm(j[k].n)]=e;PHOTOS.list.push(e);}}}catch(e){}
  PHOTOS.state="ready";
}
async function photoCard(name){
  await loadPhotos();
  const e=PHOTOS.map[norm(name)],ini=name.split(" ").filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase();
  return `<div class="photo">${e?`<img src="fotos/${esc(e.k)}.jpg" alt="${esc(name)}" width="72" height="72">`:`<div class="ph">${esc(ini)}</div>`}<div><b>${esc(name)}</b>${e?`<small>Foto: ${esc(e.artist||"autor desconocido")} · <a href="${esc(e.page)}" target="_blank" rel="noopener" style="color:var(--mut)">${esc(e.lic)}</a></small>`:""}</div></div>`;
}
function showPhoto(name){photoCard(name).then(h=>{const b=document.getElementById("endbox");if(b)b.insertAdjacentHTML("afterbegin",h);});}


/* ================= arranque ================= */
show("hoy");
flushPending();
/* ================= app instalable (PWA) ================= */
(function(){
  const standalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  const KEY="minijuegos.installDismiss";
  const dismissed=()=>{try{return localStorage.getItem(KEY)==="1";}catch(e){return false;}};
  let deferred=null,text="";
  window.installBarHtml=function(){
    if(standalone()||dismissed()||!text)return "";
    return `<div class="install" id="install"><span class="msg">${text}</span>${deferred?`<button class="btn" id="installBtn" type="button">Instalar</button>`:""}<button class="x" id="installX" type="button" aria-label="Cerrar">✕</button></div>`;
  };
  window.bindInstallBar=function(){
    const b=document.getElementById("installBtn"),x=document.getElementById("installX");
    if(b)b.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;text="";show("hoy");};
    if(x)x.onclick=()=>{try{localStorage.setItem(KEY,"1");}catch(e){}text="";const e=document.getElementById("install");if(e)e.remove();};
  };
  function refresh(){const v=document.querySelector(".view.on");if(v&&v.id==="v-hoy"&&!document.getElementById("game").classList.contains("on"))renderHoy();}
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;text="Instala la app: se abre con un toque y funciona sin conexión.";refresh();});
  window.addEventListener("appinstalled",()=>{text="";refresh();});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){text="Para instalarla en el iPhone: toca el botón Compartir (o el menú ⋯ en Chrome) y elige «Añadir a pantalla de inicio».";refresh();}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)document.getElementById("upd").hidden=false;});
    document.getElementById("updBtn").onclick=()=>location.reload();
  }
})();
</script>
