.mhead,.mcs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}

.tokb{margin-top:8px;border-color:var(--gold);color:var(--gold)}
.toks{display:grid;gap:8px}.tok{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.tok b{font-size:24px;min-width:26px;text-align:center;color:var(--gold)}.tok span{font-weight:700;font-size:14px}.tok small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.medals{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.medal{width:64px;text-align:center;color:var(--c)}.medal svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8;display:block;margin:0 auto 4px;padding:9px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--bg2));box-sizing:content-box}.medal small{font-size:11px;color:var(--mut)}
.snav{display:flex;align-items:center;gap:10px;margin:12px 0 4px}.snav>div{flex:1;text-align:center}.snav b{display:block}.snav small{color:var(--mut);font-size:12.5px}.snav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px}.snav button:disabled{opacity:.35}
.champ{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--gold);margin-bottom:10px}.champ svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.mvp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--gold)}.mvp svg{width:13px;height:13px;stroke:currentColor;fill:currentColor}
.code{font:800 26px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center}

.board{margin:16px 0 8px;padding:16px;border-radius:var(--r3);background:linear-gradient(160deg,#18265a 0,#101a38 70%);border:1px solid #2b3a74;box-shadow:var(--sh)}

.x2{background:var(--card);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--mut);padding:0}

.av svg{width:58%;height:58%}
.stp{display:flex;align-items:center;gap:10px}.stp b{min-width:26px;text-align:center;font-size:24px}.stp .btn{padding:8px 16px;font-size:20px;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
let NOW=()=>new Date();               /* reemplazable en pruebas */

/* ---- Recompensas con video. Hoy el anuncio es SIMULADO: para conectar uno real, sustituir show() por el SDK de la red publicitaria
   (debe devolver una promesa true si el usuario lo vio entero). Si el anuncio falla, se concede la recompensa igualmente. ---- */
const ADS={provider:"sim",cap:6,secs:5,gptUnit:""};   /* provider "gpt" + gptUnit "/RED/unidad" activa Google Ad Manager (ver docs/ANUNCIOS.md) */
/* Google Publisher Tag, anuncio recompensado. SIN PROBAR contra Ad Manager real (hace falta cuenta aprobada y consentimiento TCF). Si no hay anuncio en 9 s, se concede la recompensa. */
function showGpt(){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;clearTimeout(t);res(v);}};
    const t=setTimeout(()=>fin(true),9000);
    toast("Cargando anuncio...");
    window.googletag=window.googletag||{cmd:[]};
    if(!document.querySelector('script[src*="gpt.js"]')){const sc=document.createElement("script");sc.async=true;sc.src="https://securepubads.g.doubleclick.net/tag/js/gpt.js";sc.onerror=()=>fin(true);document.head.appendChild(sc);}
    googletag.cmd.push(()=>{
      const slot=googletag.defineOutOfPageSlot(ADS.gptUnit,googletag.enums.OutOfPageFormat.REWARDED);
      if(!slot)return fin(true);
      slot.addService(googletag.pubads());
      googletag.pubads().addEventListener("rewardedSlotReady",e=>{clearTimeout(t);e.makeRewardedVisible();});
      googletag.pubads().addEventListener("rewardedSlotGranted",()=>fin(true));
      googletag.pubads().addEventListener("rewardedSlotClosed",()=>{fin(false);try{googletag.destroySlots([slot]);}catch(e){}});
      googletag.enableServices();googletag.display(slot);
    });
  });
}
const Rewards={
  state(){const t=today();if(!S.ads||S.ads.d!==t)S.ads={d:t,n:0};return S.ads;},
  left(){return Math.max(0,ADS.cap-this.state().n);},
  show(label){
    if(ADS.provider==="gpt"&&ADS.gptUnit)return showGpt();
    return new Promise(res=>{
      if(ADS.secs<=0)return res(true);
      const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");
      let n=ADS.secs;
      const draw=()=>{el.innerHTML=`<div class="sh" style="text-align:center"><div class="mut" style="font-size:12.5px">Anuncio (simulado)</div><div style="font:800 40px system-ui;margin:10px 0">${n>0?n:"✔"}</div><div style="margin-bottom:12px">${esc(label||"Mira el vídeo para conseguir la recompensa")}</div>
        <div class="row"><button class="btn ghost" id="adx">Cancelar</button><button class="btn" id="adok" ${n>0?"disabled":""}>Recoger recompensa</button></div></div>`;
        el.querySelector("#adx").onclick=()=>{clearInterval(iv);el.remove();res(false);};
        el.querySelector("#adok").onclick=()=>{clearInterval(iv);el.remove();res(true);};};
      const iv=setInterval(()=>{n--;if(n<=0)clearInterval(iv);draw();},1000);
      draw();document.body.appendChild(el);
    });
  },
  async request(label){
    if(this.left()<=0){toast("Has visto todos los vídeos de hoy. Vuelve mañana.");return false;}
    let ok;try{ok=await this.show(label);}catch(e){ok=true;}
    if(ok){this.state().n++;save();}
    return ok;
  }
};

/* un dia cuenta para la racha si juegas al menos un reto obligatorio (antes de RULE_DAY, cualquier juego) */
function dayCounts(ds){
  if(S.saved&&S.saved[ds])return true;
  const r=S.days[ds];if(!r)return false;
  const ks=Object.keys(r);if(!ks.length)return false;
  return ds<RULE_DAY||ks.some(k=>requiredOf(ds).includes(k));
}
function streak(){
  let d=dayNum(today()),cur=0;
  if(!dayCounts(dstrUTC(d))) d--;                  /* si hoy aún no has jugado, la racha sigue viva hasta ayer */
  while(dayCounts(dstrUTC(d))){cur++;d--;}
  return cur;
}

const LADDER=[
 {n:3,medal:"Racha de 3 días",txt:"Medalla"},
 {n:7,medal:"Racha de 7 días",hint:1,txt:"Medalla y comodín de pista"},
 {n:10,life:1,txt:"Comodín de vida extra"},
 {n:14,medal:"Racha de 14 días",txt:"Medalla"},
 {n:30,medal:"Racha de 30 días",hint:1,life:1,txt:"Medalla, comodín de pista y de vida extra"},
 {n:100,medal:"Racha de 100 días",txt:"Medalla especial"},
 {n:365,medal:"Racha de 365 días",txt:"Medalla especial"}
];
const tokN=k=>(S.tokens&&S.tokens[k])||0;
function tokUse(k){if(tokN(k)<1)return false;S.tokens[k]--;save();return true;}
function tokGive(k,n){S.tokens=S.tokens||{hint:0,life:0};S.tokens[k]=Math.min(2,tokN(k)+n);}
/* racha en peligro: ayer no se jugo pero antes de ayer si; se puede salvar con un video, como mucho una vez cada 7 dias */
function streakRescue(){
  const n=dayNum(today()),y=dstrUTC(n-1);
  if(dayCounts(y)||!dayCounts(dstrUTC(n-2)))return null;
  if(S.lastSave&&n-dayNum(S.lastSave)<7)return null;
  let d=n-2,len=0;while(dayCounts(dstrUTC(d))){len++;d--;}
  return len>=3?{day:y,len}:null;
}
function checkStreak(){
  const cur=streak(),got=[];
  S.claimed=S.claimed||{};S.medals=S.medals||{};
  for(const L of LADDER){
    if(cur<L.n||S.claimed[L.n])continue;
    S.claimed[L.n]=today();
    if(L.medal)S.medals["streak"+L.n]={t:"streak",n:L.n,name:L.medal,day:today()};
    if(L.hint)tokGive("hint",L.hint);if(L.life)tokGive("life",L.life);
    got.push(L);
  }
  if(got.length){save();const L=got[got.length-1];setTimeout(()=>{try{toast("¡Racha de "+L.n+" días! "+L.txt);}catch(e){}},400);}
}
/* progreso en un objeto: sirve para la copia de seguridad en texto y para la nube */
function progressObj(){return {v:1,days:S.days,arch:S.arch,medals:S.medals,claimed:S.claimed,tokens:S.tokens,saved:S.saved,paid:S.paid,lastSave:S.lastSave,alias:S.alias,avatar:S.avatar};}
function mergeProgress(o){
  if(!o||o.v!==1||typeof o.days!=="object")throw new Error("Código no válido");
  for(const d in o.days){S.days[d]=S.days[d]||{};for(const g in o.days[d])if(S.days[d][g]==null)S.days[d][g]=o.days[d][g];}
  for(const d in (o.arch||{})){S.arch[d]=S.arch[d]||{};for(const g in o.arch[d])if(S.arch[d][g]==null)S.arch[d][g]=o.arch[d][g];}
  S.medals=Object.assign({},o.medals||{},S.medals);S.claimed=Object.assign({},o.claimed||{},S.claimed);
  S.saved=Object.assign({},o.saved||{},S.saved);S.paid=Object.assign({},o.paid||{},S.paid);
  S.tokens=S.tokens||{hint:0,life:0};for(const k of ["hint","life"])S.tokens[k]=Math.max(tokN(k),(o.tokens&&o.tokens[k])||0);
  if((o.lastSave||"")>(S.lastSave||""))S.lastSave=o.lastSave;
  if(!S.alias&&o.alias)S.alias=o.alias;if(!S.avatar&&o.avatar)S.avatar=o.avatar;
  save();
}

  if(!/^MJ1:/.test(c))throw new Error("Código no válido");
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));}catch(e){throw new Error("Código no válido");}
  mergeProgress(o);
}

/* Interfaz: init(), setAlias(a), createLeague(name)->{code}, joinLeague(code)->{name}, myLeagues()->[{id,code,name}],
   board(leagueId,fromDay,toDay)->[{alias,mm,once,total}], submit(day,game,score). Dos implementaciones: Local y Supabase. */
const LocalBackend={
  kind:"local",
  db(){try{return JSON.parse(localStorage.getItem("minijuegos.local"))||{leagues:[]};}catch(e){return {leagues:[]};}},
  put(d){localStorage.setItem("minijuegos.local",JSON.stringify(d));},
  async setAlias(){},
  async setAvatar(){},
  async setLeagueAvatar(id,a){const d=this.db();const l=d.leagues.find(x=>x.id===id);if(l){l.avatar=a;this.put(d);}},
  async createLeague(name){const d=this.db();const code=Math.random().toString(36).slice(2,8).toUpperCase();d.leagues.push({id:code,code,name,since:today(),owner:true});this.put(d);return {code,id:code,name};},
  async joinLeague(code){const d=this.db();const l=d.leagues.find(x=>x.code===code.toUpperCase());if(!l)throw new Error("No existe esa liga");return l;},
  async myLeagues(){return this.db().leagues;},
  async board(id,from,to){const g={};let total=0;const L=this.db().leagues.find(x=>x.id===id);if(L&&L.since&&L.since>from)from=L.since;for(let n=dayNum(from);n<=dayNum(to);n++){const r=S.days[dstrUTC(n)];if(r)for(const k in r){if(dstrUTC(n)>=RULE_DAY&&!requiredOf(dstrUTC(n)).includes(k))continue;g[k]=(g[k]||0)+r[k];total+=r[k];}}return [{alias:S.alias||"Tú",avatar:S.avatar||"",total,g}];},
  async days(id,from,to){
    const L=this.db().leagues.find(x=>x.id===id);if(L&&L.since&&L.since>from)from=L.since;
    const out=[{k:1,alias:S.alias||"Tú",avatar:S.avatar||"",me:true,day:null,tot:0,ng:0}];
    for(let n=dayNum(from);n<=dayNum(to);n++){const d=dstrUTC(n),r=S.days[d];if(!r)continue;let tot=0,ng=0;for(const k in r){if(d>=RULE_DAY&&!requiredOf(d).includes(k))continue;tot+=r[k];ng++;}if(ng)out.push({k:1,alias:S.alias||"Tú",avatar:S.avatar||"",me:true,day:d,tot,ng});}
    return out;
  },
  async submit(){}
};

  kind:"supabase",

  async auth(){
    if(this.tok&&this.tok.access_token&&this.tok.exp>Date.now()/1000+60)return;

    if(this.tok&&this.tok.refresh_token){
      r=await fetch(SB.supabaseUrl+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:this.tok.refresh_token})});

    if(!r.ok)throw new Error("No se pudo conectar con el servidor");
    const j=await r.json();
    this.tok={access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
    localStorage.setItem("minijuegos.sb",JSON.stringify(this.tok));
  },
  async call(path,opt){
    await this.auth();

    if(!r.ok){let m="Error del servidor";try{const j=await r.json();m=j.message||m;}catch(e){}throw new Error(m);}
    const t=await r.text();return t?JSON.parse(t):null;
  },
  rpc(n,args){return this.call("rpc/"+n,{method:"POST",body:JSON.stringify(args||{})});},
  async setAlias(a){await this.rpc("set_alias",{p_alias:a});},
  async setAvatar(a){await this.rpc("set_avatar",{p_avatar:a||null});},
  async setLeagueAvatar(id,a){await this.rpc("set_league_avatar",{p_league:id,p_avatar:a||null});},
  async createLeague(name){const r=await this.rpc("create_league",{p_name:name});return {code:r.code,id:r.id,name};},
  async joinLeague(code){const r=await this.rpc("join_league",{p_code:code.toUpperCase()});return {id:r.id,code:r.code,name:r.name};},

  async days(id,from,to){return await this.rpc("league_days",{p_league:id,p_from:from,p_to:to});},

  /* cuentas: el usuario anonimo se convierte en cuenta con correo y codigo de 6 cifras */
  async authReq(path,method,body,bearer){
    const h={apikey:SB.supabaseKey,"Content-Type":"application/json"};
    if(bearer){await this.auth();h.Authorization="Bearer "+this.tok.access_token;}
    const r=await fetch(SB.supabaseUrl+"/auth/v1/"+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    let j=null;try{j=await r.json();}catch(e){}

async function flushPending(){
  if(Backend.kind==="local"||!S.alias)return;
  const rest=[];
  for(const p of S.pending){try{await Backend.submit(p.day,p.game,p.score);}catch(e){rest.push(p);}}
  S.pending=rest;save();
}
const LAUNCH="2026-09-30";                      /* primer reto diario; el archivo empieza aquí */
function scoreOf(day,game){ const a=(S.days[day]||{})[game]; return a!=null?a:(S.arch[day]||{})[game]; }   /* lo jugado el propio día manda sobre el archivo */
/* Partida en curso: se guarda tras cada jugada, así cerrar y reabrir continúa donde estabas y no permite repetir */
function progGet(day,game){ return (S.prog||{})[day+"|"+game]||null; }
function progSet(day,game,o){ (S.prog=S.prog||{})[day+"|"+game]=o; save(); }
function recordScore(day,game,score){
  if(S.prog)delete S.prog[day+"|"+game];
  if(scoreOf(day,game)!=null){save();return;}
  if(day===today())return recordDaily(game,score);
  (S.arch[day]=S.arch[day]||{})[game]=score;save();     /* el archivo no cuenta para liga ni racha */
}
function recordDaily(game,score){
  const t=today();
  S.days[t]=S.days[t]||{};
  if(S.days[t][game]!=null)return;              /* el primer resultado del día es el que cuenta */
  S.days[t][game]=score;
  if(isReq(game,t))S.pending.push({day:t,game,score});   /* solo los 4 retos obligatorios del dia cuentan en las ligas */
  save();checkStreak();flushPending();
}

/* avatar: 'p:<icono>:<color>' (prediseñado), 'data:image/jpeg;base64,...' (foto de la galeria reducida) o vacio (iniciales) */
function avatarHtml(a,size,name){
  size=size||40;
  if(typeof a==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a))return `<img class="av" width="${size}" height="${size}" style="width:${size}px;height:${size}px" src="${a}" alt="">`;
  const m=typeof a==="string"&&a.match(/^p:([a-z]{2,12}):(\d{1,2})$/);
  if(m&&ICONS[m[1]]){const c=AV_COLORS[+m[2]%AV_COLORS.length];return `<span class="av" style="width:${size}px;height:${size}px;color:${c};background:color-mix(in srgb,${c} 18%,var(--bg2));border-color:color-mix(in srgb,${c} 45%,transparent)">${svg(m[1])}</span>`;}
  const ini=String(name||"?").split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase()||"?";
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${esc(ini)}</span>`;
}
function resizeToAvatar(file){                       /* foto de la galeria -> cuadrado 96x96 JPEG */
  return new Promise((ok,ko)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=96;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
      URL.revokeObjectURL(url);
      let q=.78,d=c.toDataURL("image/jpeg",q);while(d.length>12000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q);}
      d.length>13500?ko(new Error("Imagen demasiado grande")):ok(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error("No se pudo leer la imagen"));};
    img.src=url;
  });
}

  if(S.account)return `<div class="card"><b>Tu cuenta</b><div class="mut" style="font-size:13.5px;margin:4px 0 10px">${esc(S.account.email)}. Tu progreso, medallas y comodines se guardan en la nube y los recuperas en cualquier móvil entrando con este correo.</div><button class="btn ghost block" id="acc-sync">Sincronizar ahora</button></div>`;
  const m=ACC.mode;
  return `<div class="card"><b>Guarda tu progreso</b><div class="mut" style="font-size:13.5px;margin:4px 0 10px">Con tu correo no pierdes racha, medallas, comodines ni ligas si cambias de móvil. Te enviamos un código de 6 cifras, sin contraseña.</div>
  ${m?`<input class="alias" id="acc-mail" type="email" inputmode="email" autocomplete="email" placeholder="Tu correo" value="${esc(ACC.email)}" ${ACC.sent?"readonly":""}>
  ${ACC.sent?`<input class="alias" id="acc-code" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="Código del correo"><button class="btn block" id="acc-ok">Confirmar</button>`:`<button class="btn block" id="acc-send">Enviar código</button>`}
  <button class="btn ghost block" id="acc-cancel" style="margin-top:8px">Cancelar</button>`
  :`<div class="row"><button class="btn" id="acc-new">Guardar mi progreso</button><button class="btn ghost" id="acc-old">Ya tengo cuenta</button></div>`}</div>`;
}
function bindAccount(){
  const q=id=>document.getElementById(id);
  if(q("acc-sync"))q("acc-sync").onclick=async()=>{try{await Cloud.pull();toast("Sincronizado");renderPerfil();}catch(e){toast(e.message);}};
  if(q("acc-new"))q("acc-new").onclick=()=>{ACC={mode:"new",email:"",sent:false};renderPerfil();};
  if(q("acc-old"))q("acc-old").onclick=()=>{ACC={mode:"old",email:"",sent:false};renderPerfil();};
  if(q("acc-cancel"))q("acc-cancel").onclick=()=>{ACC={mode:"",email:"",sent:false};renderPerfil();};
  if(q("acc-send"))q("acc-send").onclick=async()=>{
    const e=q("acc-mail").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast("Escribe un correo válido");return;}
    try{if(ACC.mode==="new")await Backend.linkEmail(e);else await Backend.loginEmail(e);ACC.email=e;ACC.sent=true;toast("Código enviado. Mira tu correo");renderPerfil();}catch(x){toast(x.message);}
  };
  if(q("acc-ok"))q("acc-ok").onclick=async()=>{
    const c=q("acc-code").value.trim();if(c.length<6){toast("Escribe el código de 6 cifras");return;}
    try{
      await Backend.verify(ACC.mode==="new"?"email_change":"email",ACC.email,c);
      S.account={email:ACC.email};save();
      if(ACC.mode==="old"){await Cloud.pull();try{S.leagues=await Backend.myLeagues();}catch(e){}}else await Cloud.push(true);
      ACC={mode:"",email:"",sent:false};toast("Cuenta lista");flushPending();renderPerfil();
    }catch(x){toast(x.message);}
  };
}

/* ---------- ligas por temporadas ----------
   Temporada = 4 semanas (lunes a domingo) desde SEASON_EPOCH. Cada dia suma el total de los 4 obligatorios.
   Semana: gana quien mas suma; puntos 10/6/4 y 2 al resto con >=3 dias jugados. MVP diario: +1 al mejor dia (4 juegos jugados). */
const SEASON_EPOCH="2026-10-05",SEASON_DAYS=28,WEEK_PTS=[10,6,4],PLAY_PTS=2,MIN_DAYS=3;
const seasonOf=d=>Math.floor((dayNum(d)-dayNum(SEASON_EPOCH))/SEASON_DAYS);
const seasonRange=n=>{const a=dayNum(SEASON_EPOCH)+n*SEASON_DAYS;return [dstrUTC(a),dstrUTC(a+SEASON_DAYS-1)];};
function seasonCalc(rows,n,t){
  const a=dayNum(seasonRange(n)[0]),tn=dayNum(t),M={};
  for(const r of rows){const m=M[r.k]=M[r.k]||{k:r.k,alias:r.alias,avatar:r.avatar,me:!!r.me,days:{},wp:0,mv:0,raw:0};if(r.day){m.days[r.day]={tot:r.tot,ng:r.ng};m.raw+=r.tot;}}
  const mem=Object.values(M),weeks=[];
  for(let w=0;w<4;w++){
    const from=a+w*7,to=from+6;if(from>tn)break;
    const list=mem.map(m=>{let tot=0,days=0;for(let d=from;d<=Math.min(to,tn);d++){const x=m.days[dstrUTC(d)];if(x&&x.ng>0){tot+=x.tot;days++;}}return {m,tot,days};});
    const elig=list.filter(x=>x.days>=MIN_DAYS).sort((p,q)=>q.tot-p.tot);
    elig.forEach((x,i)=>{const rk=i>0&&elig[i-1].tot===x.tot?elig[i-1].rk:i+1;x.rk=rk;x.pts=WEEK_PTS[rk-1]!=null?WEEK_PTS[rk-1]:PLAY_PTS;x.m.wp+=x.pts;});
    list.forEach(x=>{if(x.rk==null){x.rk=null;x.pts=0;}});
    weeks.push({w,from:dstrUTC(from),to:dstrUTC(to),final:to<tn,rows:list.sort((p,q)=>(q.pts-p.pts)||(q.tot-p.tot))});
  }
  const mvp={};
  if(mem.length>=2)for(let d=a;d<=Math.min(a+SEASON_DAYS-1,tn);d++){
    const ds=dstrUTC(d),c=mem.filter(m=>m.days[ds]&&m.days[ds].ng>=4);if(!c.length)continue;
    const mx=Math.max(...c.map(m=>m.days[ds].tot));if(mx<=0)continue;
    mvp[ds]=c.filter(m=>m.days[ds].tot===mx).map(m=>m.k);mvp[ds].forEach(k=>M[k].mv++);
  }
  const table=mem.map(m=>Object.assign({pts:m.wp+m.mv},m)).sort((p,q)=>(q.pts-p.pts)||(q.raw-p.raw));
  return {n,table,weeks,mvp,members:mem.length};
}

const G=$("#game");
const T_MM=120, T_ONCE=480;                   /* segundos de cuenta atrás en el reto del día */
let TIMER=null;
function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+":"+pad(sec%60); }
/* bonus de velocidad: hasta 10 puntos, proporcional al tiempo que sobra y a la proporción de aciertos */
function timeBonus(hits,remaining,total){ return Math.round(10*(hits/10)*Math.max(0,Math.min(remaining,total))/total); }
let CUR=null;
function openGame(title,c){ stopTimer();G.innerHTML=`<div class="ghead"><button class="x" id="gx" aria-label="Cerrar">${svg("x")}</button><div class="t" style="color:${c}">${title}</div><div id="gsc" class="mut"></div><button class="qbtn" id="gq" aria-label="Cómo se juega">?</button></div><div class="wrap" id="hpw" hidden style="padding-bottom:0"><div class="help" id="hp"></div></div><div class="wrap" id="gb"></div>`;G.classList.add("on");$("#gx").onclick=closeGame;
  const h=(window.HELP||{})[CUR];if(!h){$("#gq").hidden=true;}else{$("#hp").innerHTML=h;$("#gq").onclick=()=>{$("#hpw").hidden=!$("#hpw").hidden;};}}
function closeGame(){stopTimer();G.classList.remove("on");G.innerHTML="";const v=document.querySelector(".view.on").id.slice(2);show(v);}
function startGame(id,day){
  day=day||today();CUR=id;
  if(scoreOf(day,id)!=null){return showDone(id,day);}
  ({mm:playMM,once:playOnce,tray:playTray,mist:playMist,line:playLine,vf:playVF,odd:playOdd,con:playCon,score:playScore,key:playKey,road:playRoad,table:playTable})[id](day);
}
function dayLabel(d){return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});}
function showDone(id,day){
  const g=GAMES.find(x=>x.id===id),sc=scoreOf(day,id),hoy=day===today();
  openGame(g.name+(hoy?"":" · "+dayLabel(day)),g.c);
  $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:30px">${hoy?"Tu resultado de hoy":"Tu resultado de ese día"}</div><div class="big">${sc}/100</div>
  ${hoy?`<button class="btn block" id="dsh">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="dcl">Cerrar</button>`;
  const d=$("#dsh");if(d)d.onclick=()=>share(shareText());
  $("#dcl").onclick=closeGame;
}

/* ---------- Más o menos ---------- */
function mmRounds(seed,n){
  const r=rng(seed),sets=DATA.MM,out=[];let last=-1;
  for(let i=0;i<n;i++){
    const target=3.2-i*(2.2/(n-1));           /* de pares muy distintos a pares ajustados */
    let best=null;
    for(let k=0;k<50;k++){
      let si=Math.floor(r()*sets.length);if(si===last&&sets.length>1)si=(si+1)%sets.length;
      const s=sets[si];let a=Math.floor(r()*s.items.length),b=Math.floor(r()*s.items.length);
      if(a===b)continue;
      const A=s.items[a],B=s.items[b],ratio=Math.max(A.v,B.v)/Math.max(1,Math.min(A.v,B.v));
      const d=Math.abs(Math.log(ratio)-Math.log(target));
      if(!best||d<best.d)best={d,s,A,B};
    }
    last=sets.indexOf(best.s);out.push(best);
  }
  return out;
}
function fmt(n){return n.toLocaleString("es-ES");}
function playMM(day){
  const hoy=day===today();
  openGame("Más o menos"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--mm)");
  const N=10,rounds=mmRounds(hash("mm"+day),N);
  let sv=progGet(day,"mm");
  if(!sv){ sv={i:0,hits:0,t0:Date.now()}; progSet(day,"mm",sv); }
  if(sv.hits==null) sv.hits=(sv.score||0)/10;
  let i=sv.i,hits=sv.hits,locked=false,cur=null,done=false,label="";
  const t0=sv.t0||Date.now();
  const remaining=()=>hoy?T_MM-(Date.now()-t0)/1000:Infinity;
  const hud=()=>{ $("#gsc").textContent=(hoy?"⏱ "+fmtT(remaining())+" · ":"")+label; };
  function next(){
    cur=rounds[i];locked=false;
    const flip=rng(hash("f"+day+i))()<.5;
    const [X,Y]=flip?[cur.B,cur.A]:[cur.A,cur.B];cur.X=X;cur.Y=Y;
    label="Duelo "+(i+1)+"/"+N;hud();
    $("#gb").innerHTML=`<div class="bar" style="--c:var(--mm)"><i style="width:${i/N*100}%"></i></div>
    <div class="mut" style="text-align:center">${esc(cur.s.cat)}</div><div class="q">${esc(cur.s.q)}</div>
    <div class="duel"><button class="opt${X.n.length>22?" long":""}" data-o="0"><b>${esc(X.n)}</b><div class="v"></div></button><div class="vs">o</div><button class="opt${Y.n.length>22?" long":""}" data-o="1"><b>${esc(Y.n)}</b><div class="v"></div></button></div>
    <div class="mut" style="text-align:center;margin-top:10px;font-size:13px">${esc(cur.s.asof||"")}</div><div id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  }
  function pick(o){
    if(locked||done)return;locked=true;
    const pickV=[cur.X,cur.Y][o],other=[cur.X,cur.Y][1-o],ok=pickV.v>other.v;
    const opts=document.querySelectorAll(".opt");
    [cur.X,cur.Y].forEach((it,k)=>{opts[k].querySelector(".v").innerHTML=`<span class="vn">${esc(fmt(it.v))}</span> <small class="vu">${esc(cur.s.unit)}</small>`;opts[k].classList.add(it.v>(k?cur.X:cur.Y).v?"win":"lose");});
    if(!ok)opts[o].classList.add("pickbad");
    if(ok)hits++;
    progSet(day,"mm",{i:i+1,hits,t0});                   /* si cierras aquí, continúas en el duelo siguiente */
    label=hits+" acierto"+(hits===1?"":"s");hud();
    $("#nx").innerHTML=`<button class="btn block" style="margin-top:14px" id="go">${i===N-1?"Ver resultado":"Siguiente"}</button>`;
    $("#go").onclick=()=>{i++;if(i>=N)end(false);else next();};
  }
  function end(timeout){
    if(done)return;done=true;stopTimer();
    const rem=timeout?0:Math.max(0,remaining());
    const bonus=hoy?timeBonus(hits,rem,T_MM):0,score=hits*(hoy?9:10)+bonus;
    recordScore(day,"mm",score);
    $("#gsc").textContent="";
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;margin-top:30px">${timeout?"Se acabó el tiempo. ":""}Has acertado ${hits} de ${N}${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}<button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    $("#e2").onclick=closeGame;
  }
  if(i>=N)end(false);
  else if(remaining()<=0)end(true);
  else{ next(); if(hoy)TIMER=setInterval(()=>{ if(remaining()<=0)end(true); else hud(); },250); }
}

/* ---------- Once oculto ---------- */
const PLAYERS={state:"idle",list:[]};
async function loadPlayers(){
  if(PLAYERS.state!=="idle")return;PLAYERS.state="loading";
  try{const r=await fetch("../top10/entidades/jugadores.json");if(!r.ok)throw 0;PLAYERS.list=(await r.json()).map(x=>({n:x[0],nk:norm(x[0]),sub:[x[1],x[2]||""].filter(Boolean).join(" · "),f:x[3]||60}));PLAYERS.state="ready";}catch(e){PLAYERS.state="failed";}
}
loadPlayers();
function lineupOfDay(d){const order=shuffled(DATA.LINEUPS,rng(20260930));return order[dayNum(d)%order.length];}
function rowLabel(r,R){return r===0?"Defensa":r===R-1?"Delantero":"Medio";}
function keysOf(L,a){const s=new Set([norm(a.n)]);(a.a||[]).forEach(x=>s.add(norm(x)));if(L.auto){const t=norm(a.n).split(" "),l=t[t.length-1];if(l.length>=4)s.add(l);}return [...s].filter(Boolean);}
function judge(L,raw,found){
  const q=norm(raw);if(!q)return {t:"empty"};
  let near=-1;
  for(let i=0;i<L.ans.length;i++){
    const ks=L.ans[i].keys;
    if(ks.includes(q))return found.has(i)?{t:"dup",i}:{t:"hit",i};
  }
  for(let i=0;i<L.ans.length;i++){
    if(found.has(i))continue;
    for(const k of L.ans[i].keys){const tol=k.length>=10?2:k.length>=6?1:0;if(tol&&lev(q,k)<=tol&&q.length>=4)near=i;}
  }
  return near>=0?{t:"hit",i:near}:{t:"miss"};
}
let _extra=null;
function allNames(){                                   /* base de jugadores + respuestas de todas las alineaciones que falten (sin delatar las del día) */
  if(_extra&&_extra.n===PLAYERS.list.length)return _extra.l;
  const have=new Set(PLAYERS.list.map(e=>e.nk)),add=[];
  DATA.LINEUPS.forEach(L=>L.ans.forEach(a=>{const nk=norm(a.n);if(!have.has(nk)){have.add(nk);add.push({n:a.n,nk,sub:"",f:50});}}));
  _extra={n:PLAYERS.list.length,l:PLAYERS.list.concat(add)};return _extra.l;
}
function suggestP(raw,found,L){
  const q=norm(raw);if(q.length<2)return [];
  const got=new Set([...found].map(i=>norm(L.ans[i].n)));
  const out=[];
  for(const e of allNames()){
    if(got.has(e.nk))continue;
    let s=-1;if(e.nk.startsWith(q))s=0;else if(e.nk.indexOf(" "+q)>=0)s=1;else if(q.length>=3&&e.nk.includes(q))s=2;
    if(s>=0)out.push({e,s});
  }
  out.sort((x,y)=>x.s-y.s||y.e.f-x.e.f||x.e.nk.length-y.e.nk.length);
  return out.slice(0,6).map(x=>x.e);
}
function playOnce(day){
  const hoy=day===today();
  openGame("Once oculto"+(hoy?" · hoy":" · "+dayLabel(day)),"var(--once)");
  let L=lineupOfDay(day);
  L=Object.assign({},L);L.ans=L.ans.map(a=>Object.assign({keys:keysOf(L,a)},a));
  let svo=progGet(day,"once");
  const t0=(svo&&svo.t0)||Date.now();
  const remaining=()=>hoy?T_ONCE-(Date.now()-t0)/1000:Infinity;
  let timedOut=false;
  const found=new Set(svo?svo.f:[]);let xl=svo&&svo.x||0,MAXL=5+xl;let lives=svo?svo.l:MAXL,over=!!svo&&(svo.l<=0||svo.f.length===10),slotOf=[],k=0;
  if(!over&&hoy&&remaining()<=0){over=true;timedOut=true;}
  /* cada respuesta ocupa su hueco según el orden de la formación (de defensa a ataque) */
  L.rows.forEach((n,r)=>{for(let j=0;j<n;j++)slotOf.push({r,j,idx:k++});});
  const R=L.rows.length;
  function draw(msg){
    progSet(day,"once",{f:[...found],l:lives,t0,x:xl});
    const rowsHtml=[];
    for(let r=R-1;r>=0;r--){
      rowsHtml.push(`<div class="prow">${slotOf.filter(s=>s.r===r).map(s=>{const a=L.ans[s.idx],g=found.has(s.idx);return `<div class="slot ${g?"got":over?"miss":""}">${(g||over)?esc(a.n):`?<small>${rowLabel(r,R)}</small>`}</div>`;}).join("")}</div>`);
    }
    const hearts="❤️".repeat(lives)+"🖤".repeat(MAXL-lives);
    $("#gsc").innerHTML=`${hoy?`<span id="tmr">⏱ ${fmtT(remaining())}</span> `:""}<span class="lives">${hearts}</span>`;
    $("#gb").innerHTML=`<div class="mut" style="text-align:center;font-size:14px">${esc(L.title.replace(/^Jugadores de campo titulares d(e|el) /,""))}</div>
    <div class="pitch">${rowsHtml.join("")}<div class="prow"><div class="slot gk got" style="width:auto;max-width:none;flex:0 0 auto;min-height:0;padding:8px 18px;font-size:14px;white-space:nowrap;background:#fff;color:#111">🧤 ${esc(L.gk||"Portero")}</div></div></div>
    <div class="mut" style="text-align:center;margin-bottom:6px">${found.size}/10 jugadores · escribe el apellido o el nombre</div>
    ${over?"":`<div class="inp"><input id="gi" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Jugador de campo..."><button class="btn" id="gs">OK</button><div class="sug" id="sg" style="display:none"></div></div>`}
    ${over?"":tokBtns("o",{life:xl<1&&lives<=2})}
    ${over?"":`<button class="btn ghost block" id="giveup" style="margin-top:8px">Rendirme</button>`}
    <div class="fb" id="fb">${msg||""}</div><div id="endbox"></div>`;
    if(!over){
      $("#giveup").onclick=()=>{if(confirm("¿Rendirte? Te quedas con "+found.size+" acierto"+(found.size===1?"":"s")+".")){lives=0;over=true;draw("Te has rendido");}};
      const ol=$("#ol");if(ol)ol.onclick=()=>{if(xl<1&&tokUse("life")){xl=1;MAXL=6;lives++;draw("Comodín usado: una vida más.");}};
      const inp=$("#gi");
      const submit=v=>{const val=(v??inp.value);if(!val.trim())return;try2(val);};
      $("#gs").onclick=()=>submit();
      inp.onkeydown=e=>{if(e.key==="Enter")submit();};
      inp.oninput=()=>{const s=suggestP(inp.value,found,L),box=$("#sg");if(!s.length){box.style.display="none";return;}box.style.display="block";box.innerHTML=s.map((e,n)=>`<button data-n="${n}">${esc(e.n)}<small>${esc(e.sub)}</small></button>`).join("");box.querySelectorAll("button").forEach((b,n)=>b.onclick=()=>submit(s[n].n));};
      inp.focus();
    }
    if(over)finish();
  }
  function try2(v){
    const j=judge(L,v,found);
    if(j.t==="hit"){found.add(j.i);if(found.size===10){over=true;return draw("¡Completo!");}return draw("✔ "+esc(L.ans[j.i].n));}
    if(j.t==="dup")return draw("Ya lo tenías");
    lives--;if(lives<=0){over=true;return draw("Sin vidas");}
    draw("✘ No juega de titular (o no lo reconozco). Pierdes una vida.");
  }
  function finish(){
    stopTimer();
    const rem=timedOut?0:Math.max(0,remaining()),bonus=hoy?timeBonus(found.size,rem,T_ONCE):0;
    const score=found.size*(hoy?9:10)+bonus;
    recordScore(day,"once",score);
    $("#endbox").innerHTML=`<div class="mut" style="text-align:center">${timedOut?"Se acabó el tiempo. ":""}${found.size} de 10${hoy?" · bonus de velocidad +"+bonus:""}</div><div class="big">${score}/100</div>
    ${hoy?`<button class="btn block" id="e1">Compartir</button>`:""}
    <button class="btn block ghost" style="margin-top:10px" id="e2">Cerrar</button>`;
    const a=$("#e1");if(a)a.onclick=()=>share(shareText());
    funAttach(funOf(null,L.k));$("#e2").onclick=closeGame;
  }
  draw(timedOut?"Se acabó el tiempo":"");
  if(hoy&&!over)TIMER=setInterval(()=>{
    if(over){stopTimer();return;}
    if(remaining()<=0){timedOut=true;over=true;draw("Se acabó el tiempo");return;}
    const t=document.getElementById("tmr");if(t)t.textContent="⏱ "+fmtT(remaining());
  },250);
}

/* ================= app instalable (PWA) ================= */
(function(){
  const standalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  const KEY="minijuegos.installDismiss";
  const dismissed=()=>{try{return localStorage.getItem(KEY)==="1";}catch(e){return false;}};
  let deferred=null,text="";
  window.installBarHtml=function(){
    if(standalone()||dismissed()||!text)return "";
    return `<div class="install" id="install"><span class="msg">${text}</span>${deferred?`<button class="btn" id="installBtn" type="button">Instalar</button>`:""}<button class="x" id="installX" type="button" aria-label="Cerrar">✕</button></div>`;
  };
  window.bindInstallBar=function(){
    const b=document.getElementById("installBtn"),x=document.getElementById("installX");
    if(b)b.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;text="";show("hoy");};
    if(x)x.onclick=()=>{try{localStorage.setItem(KEY,"1");}catch(e){}text="";const e=document.getElementById("install");if(e)e.remove();};
  };
  function refresh(){const v=document.querySelector(".view.on");if(v&&v.id==="v-hoy"&&!document.getElementById("game").classList.contains("on"))renderHoy();}
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;text="Instala la app: se abre con un toque y funciona sin conexión.";refresh();});
  window.addEventListener("appinstalled",()=>{text="";refresh();});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){text="Para instalarla en el iPhone: toca el botón Compartir (o el menú ⋯ en Chrome) y elige «Añadir a pantalla de inicio».";refresh();}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)document.getElementById("upd").hidden=false;});
    document.getElementById("updBtn").onclick=()=>location.reload();
  }
})();
